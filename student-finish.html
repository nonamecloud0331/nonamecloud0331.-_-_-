<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="출석 체크 완료">
    <title>출석 체크 완료</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .illustration {
            width: 180px;
            height: 180px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .message {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            animation: fadeIn 0.8s ease-out 0.3s both;
        }

        .duplicate-message {
            font-size: 18px;
            color: #f5576c;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-out 0.5s both;
        }

        .success-message {
            font-size: 16px;
            color: #4CAF50;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-out 0.5s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            animation: fadeIn 0.8s ease-out 0.7s both;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-home {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-again {
            background: #f5f5f5;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-again:hover {
            background: #efefef;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
            }

            .message {
                font-size: 24px;
            }

            .duplicate-message {
                font-size: 16px;
            }

            .success-message {
                font-size: 14px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="illustration">✅</div>
        
        <div class="message" id="mainMessage">출석 체크 완료!</div>
        <div class="duplicate-message" id="duplicateMessage" style="display: none;"></div>
        <div class="success-message" id="successMessage" style="display: none;"></div>

        <div class="button-group">
            <button class="btn btn-home" onclick="goHome()">홈으로</button>
            <button class="btn btn-again" onclick="goStudentMode()">다시 출석</button>
        </div>
    </div>

    <script>
        window.addEventListener('load', function() {
            const isDuplicate = sessionStorage.getItem('isDuplicate');
            const studentId = sessionStorage.getItem('studentId');
            const studentName = sessionStorage.getItem('studentName');
            const duplicateMsg = document.getElementById('duplicateMessage');
            const successMsg = document.getElementById('successMessage');
            
            if (isDuplicate === 'true') {
                document.getElementById('mainMessage').textContent = '알림';
                duplicateMsg.style.display = 'block';
                duplicateMsg.textContent = '⚠️ 이미 출석하였습니다. 오늘은 추가로 출석할 수 없습니다.';
            } else if (isDuplicate === 'false') {
                successMsg.style.display = 'block';
                successMsg.textContent = `✓ ${studentId} ${studentName} 학생이 출석되었습니다.`;
            }
            
            sessionStorage.removeItem('isDuplicate');
            sessionStorage.removeItem('studentId');
            sessionStorage.removeItem('studentName');
        });

        function goHome() {
            window.location.href = 'index.html';
        }

        function goStudentMode() {
            window.location.href = 'student-mode.html';
        }
    </script>
</body>
</html>
