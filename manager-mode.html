<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="관리자 모드 - 출석 관리">
    <title>관리자 모드 - 출석 관리</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header-title {
            font-size: 36px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            margin-bottom: 10px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .logout-btn, .backup-btn, .restore-btn, .sync-btn, .settings-btn {
            background: white;
            color: #f5576c;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            display: inline-block;
            font-size: 14px;
        }

        .logout-btn:hover, .backup-btn:hover, .restore-btn:hover, .sync-btn:hover, .settings-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .sync-btn.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        .section-title {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #f5576c;
        }

        /* 테이블 스타일 */
        .table-wrapper {
            overflow-x: auto;
            max-height: 500px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        table thead {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border: 1px solid #ddd;
        }

        table td {
            padding: 12px;
            border: 1px solid #eee;
        }

        table tbody tr {
            transition: background-color 0.3s ease;
        }

        table tbody tr:hover {
            background-color: #f9f9f9;
        }

        table tbody tr:nth-child(even) {
            background-color: #f5f5f5;
        }

        .no-data {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        /* 리스트 2, 3 스타일 */
        .editable-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .list-item {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .list-item input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .list-item input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .btn-delete:hover {
            background: #d32f2f;
            transform: scale(1.05);
        }

        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-top: 10px;
            width: 100%;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        /* 버튼들의 모임 */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .student-btn {
            padding: 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #333;
            transition: all 0.3s ease;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .student-btn:hover {
            background: #f0f0f0;
            border-color: #f5576c;
        }

        .student-btn.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-color: #f5576c;
        }

        .chart-container {
            position: relative;
            height: 350px;
            margin-top: 20px;
        }

        .student-search {
            width: 100%;
            padding: 12px 15px;
            font-size: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: border-color 0.3s ease;
        }

        .student-search:focus {
            outline: none;
            border-color: #f5576c;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }

        .stat-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 6px 16px rgba(245, 87, 108, 0.25);
        }

        .stat-card.muted {
            background: linear-gradient(135deg, #a8a8a8 0%, #7a7a7a 100%);
        }

        .stat-card-value {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .stat-card-label {
            font-size: 12px;
            opacity: 0.9;
        }

        .view-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .view-toggle-btn {
            padding: 10px 18px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            color: #666;
            transition: all 0.3s ease;
        }

        .view-toggle-btn:hover {
            border-color: #f5576c;
        }

        .view-toggle-btn.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-color: #f5576c;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .chart-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 350px;
            color: #999;
            font-size: 18px;
            background: #f9f9f9;
            border-radius: 10px;
            border: 2px dashed #ddd;
        }

        .status-message {
            text-align: center;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .modal-content p {
            margin-bottom: 15px;
            color: #666;
            font-size: 14px;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .modal-content input:focus {
            outline: none;
            border-color: #f5576c;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .modal-btn-save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .modal-btn-cancel {
            background: #ddd;
            color: #333;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        #restoreFileInput {
            display: none;
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }
        }

        /* 스크롤바 스타일 */
        .table-wrapper::-webkit-scrollbar,
        .editable-list::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .table-wrapper::-webkit-scrollbar-track,
        .editable-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .table-wrapper::-webkit-scrollbar-thumb,
        .editable-list::-webkit-scrollbar-thumb {
            background: #f5576c;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">📊 관리자 모드</div>
        <div class="header-buttons">
            <button class="backup-btn" onclick="backupData()">💾 로컬 백업</button>
            <button class="restore-btn" onclick="document.getElementById('restoreFileInput').click()">📂 로컬 복구</button>
            <button class="sync-btn" id="syncBtn" onclick="openSettings()">⚙️ GitHub 설정</button>
            <button class="sync-btn" id="githubSyncBtn" onclick="syncToGithub()">☁️ GitHub 동기화</button>
            <button class="logout-btn" onclick="logout()">로그아웃</button>
        </div>
        <div id="statusMessage"></div>
        <input type="file" id="restoreFileInput" accept=".json" onchange="restoreData(event)">
    </div>

    <!-- 설정 모달 -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h2>⚙️ GitHub 설정</h2>
            <p><strong>GitHub Personal Access Token:</strong></p>
            <input type="password" id="tokenInput" placeholder="ghp_로 시작하는 토큰 입력">
            
            <p style="margin-top: 20px;"><strong>설정 방법:</strong></p>
            <p style="font-size: 13px; line-height: 1.6;">
                1. GitHub 로그인<br>
                2. Settings → Developer settings → Personal access tokens<br>
                3. Generate new token (classic) 클릭<br>
                4. repo 체크박스만 선택<br>
                5. Generate token → 토큰 복사<br>
                6. 위 입력창에 붙여넣기
            </p>

            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="closeSettings()">취소</button>
                <button class="modal-btn modal-btn-save" onclick="saveSettings()">저장</button>
            </div>
        </div>
    </div>

    <div class="main-container">
        <!-- 출석 기록 (표 형식) -->
        <div class="section full-width">
            <div class="section-title">📋 출석 기록</div>
            <div class="table-wrapper">
                <table id="attendanceTable">
                    <thead>
                        <tr>
                            <th>날짜</th>
                            <th>시간</th>
                            <th>학번</th>
                            <th>이름</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTableBody">
                        <tr>
                            <td colspan="4" class="no-data">출석 기록이 없습니다</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 이름 관리 -->
        <div class="section">
            <div class="section-title">👤 이름 리스트</div>
            <div class="editable-list" id="nameList"></div>
            <button class="btn-add" onclick="addName()">+ 이름 추가</button>
        </div>

        <!-- 학번 관리 -->
        <div class="section">
            <div class="section-title">🆔 학번 리스트</div>
            <div class="editable-list" id="idList"></div>
            <button class="btn-add" onclick="addId()">+ 학번 추가</button>
        </div>

        <!-- 개인별 출석 그래프 -->
        <div class="section full-width">
            <div class="section-title">📈 학생별 출석 현황</div>

            <input type="text" id="studentSearch" class="student-search" placeholder="🔍 학번 또는 이름으로 검색..." oninput="filterStudentButtons()">

            <div class="buttons-grid" id="studentButtons"></div>

            <div id="statsCards" class="stats-cards"></div>

            <div class="view-toggle">
                <button class="view-toggle-btn active" id="viewMonthlyBtn" onclick="setViewMode('monthly')">월별 보기</button>
                <button class="view-toggle-btn" id="viewWeeklyBtn" onclick="setViewMode('weekly')">주별 보기 (최근 12주)</button>
            </div>

            <div class="chart-container">
                <canvas id="attendanceChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let chart = null;
        let githubToken = null;
        const GITHUB_OWNER = 'nonamecloud0331';
        const GITHUB_REPO = 'nonamecloud0331.-_-_-';
        const DATA_FILE = 'attendance-data.json';

        // 학생 정보 (전체 화면에서 공유)
        const studentData = [
            { id: '10503', name: '김건욱' },
            { id: '10702', name: '김주영' },
            { id: '10708', name: '서이준' },
            { id: '10716', name: '이재하' },
            { id: '10723', name: '차지호' },
            { id: '20210', name: '민하율' },
            { id: '20221', name: '이준서' },
            { id: '20225', name: '조승연' },
            { id: '20326', name: '최민준' },
            { id: '20405', name: '강서준' },
            { id: '20422', name: '이예준' },
            { id: '20619', name: '이윤건' },
            { id: '20717', name: '이건우' },
            { id: '20720', name: '이재욱' },
            { id: '20801', name: '강도윤' },
            { id: '30204', name: '김량렬' },
            { id: '30425', name: '정진원' },
            { id: '30514', name: '손나빈' },
            { id: '30706', name: '김영헌' },
            { id: '30720', name: '장시현' }
        ];

        let currentStudent = null; // { id, name }
        let viewMode = 'monthly'; // 'monthly' | 'weekly'

        // 페이지 로드 시 초기화
        window.addEventListener('load', function() {
            loadSettings();
            loadDataFromLocalStorage();
            loadAttendanceRecords();
            loadStudentLists();
            loadStudentButtons();
            // 자동으로 GitHub에서 데이터 로드 시도
            autoLoadFromGithub();
        });

        // 설정 모달 열기
        function openSettings() {
            document.getElementById('settingsModal').style.display = 'block';
        }

        // 설정 모달 닫기
        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        // 설정 저장
        function saveSettings() {
            const token = document.getElementById('tokenInput').value.trim();

            if (!token) {
                alert('토큰을 입력해주세요!');
                return;
            }

            if (!token.startsWith('ghp_')) {
                alert('올바른 토큰이 아닙니다! (ghp_로 시작해야 합니다)');
                return;
            }

            localStorage.setItem('githubToken', token);
            showStatus('✅ GitHub 토큰이 저장되었습니다!', 'success');
            closeSettings();
            loadSettings();
        }

        // 설정 로드
        function loadSettings() {
            const savedToken = localStorage.getItem('githubToken');
            if (savedToken) {
                githubToken = savedToken;
            }
        }

        // GitHub에서 자동 로드
        async function autoLoadFromGithub() {
            if (!githubToken) {
                return;
            }

            try {
                const response = await fetch(
                    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_FILE}`,
                    {
                        headers: {
                            'Authorization': `token ${githubToken}`,
                            'Accept': 'application/vnd.github.v3.raw'
                        }
                    }
                );

                if (response.ok) {
                    const data = await response.json();
                    if (data.records && Array.isArray(data.records)) {
                        localStorage.setItem('attendanceRecords', JSON.stringify(data.records));
                        loadAttendanceRecords();
                        loadStudentButtons();
                        showStatus('✅ GitHub에서 데이터를 불러왔습니다!', 'success');
                    }
                }
            } catch (error) {
                console.log('GitHub 자동 로드 시도');
            }
        }

        // GitHub에 데이터 업로드
        async function syncToGithub() {
            if (!githubToken) {
                alert('⚙️ 먼저 GitHub 토큰을 설정해주세요!');
                openSettings();
                return;
            }

            const syncBtn = document.getElementById('githubSyncBtn');
            syncBtn.classList.add('loading');
            syncBtn.textContent = '⏳ 동기화 중...';

            try {
                const attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords') || '[]');
                const dataContent = JSON.stringify(
                    {
                        records: attendanceRecords,
                        lastUpdated: new Date().toISOString()
                    },
                    null,
                    2
                );

                // Base64로 인코딩
                const encodedContent = btoa(unescape(encodeURIComponent(dataContent)));

                // 파일의 SHA 값 가져오기 (파일이 있으면)
                let sha = null;
                try {
                    const checkResponse = await fetch(
                        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_FILE}`,
                        {
                            headers: {
                                'Authorization': `token ${githubToken}`
                            }
                        }
                    );
                    if (checkResponse.ok) {
                        const fileData = await checkResponse.json();
                        sha = fileData.sha;
                    }
                } catch (e) {
                    console.log('새로운 파일 생성');
                }

                // 파일 업로드/수정
                const uploadResponse = await fetch(
                    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_FILE}`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${githubToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `📝 출석 데이터 자동 동기화 - ${new Date().toLocaleString('ko-KR')}`,
                            content: encodedContent,
                            sha: sha
                        })
                    }
                );

                if (uploadResponse.ok) {
                    showStatus('✅ GitHub에 데이터를 저장했습니다!', 'success');
                } else {
                    const errorData = await uploadResponse.json();
                    showStatus(`❌ 오류: ${errorData.message}`, 'error');
                }
            } catch (error) {
                showStatus(`❌ 오류: ${error.message}`, 'error');
            } finally {
                syncBtn.classList.remove('loading');
                syncBtn.textContent = '☁️ GitHub 동기화';
            }
        }

        // 상태 메시지 표시
        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = `status-message status-${type}`;
            setTimeout(() => {
                statusDiv.textContent = '';
                statusDiv.className = '';
            }, 3000);
        }

        // 로컬 스토리지에서 데이터 로드
        function loadDataFromLocalStorage() {
            const attendanceRecords = localStorage.getItem('attendanceRecords');
            if (!attendanceRecords) {
                localStorage.setItem('attendanceRecords', JSON.stringify([]));
            }
        }

        // 출석 기록 로드
        function loadAttendanceRecords() {
            const attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords') || '[]');
            const tableBody = document.getElementById('attendanceTableBody');

            if (attendanceRecords.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="4" class="no-data">출석 기록이 없습니다</td></tr>';
                return;
            }

            tableBody.innerHTML = attendanceRecords.map(record => `
                <tr>
                    <td>${record.date}</td>
                    <td>${record.time}</td>
                    <td>${record.id}</td>
                    <td>${record.name}</td>
                </tr>
            `).join('');
        }

        // 학생 리스트 로드
        function loadStudentLists() {
            // 이름 리스트
            const nameList = document.getElementById('nameList');
            const names = [...new Set(studentData.map(s => s.name))].sort();
            nameList.innerHTML = names.map((name, index) => `
                <div class="list-item">
                    <input type="text" value="${name}" data-type="name" data-index="${index}">
                    <button class="btn-delete" onclick="deleteName(${index})">삭제</button>
                </div>
            `).join('');

            // 학번 리스트
            const idList = document.getElementById('idList');
            const ids = [...new Set(studentData.map(s => s.id))].sort();
            idList.innerHTML = ids.map((id, index) => `
                <div class="list-item">
                    <input type="text" value="${id}" data-type="id" data-index="${index}">
                    <button class="btn-delete" onclick="deleteId(${index})">삭제</button>
                </div>
            `).join('');
        }

        // 학생 버튼 로드 (등록된 전체 학생 기준, 출석 기록 유무와 무관)
        function loadStudentButtons() {
            const studentButtons = document.getElementById('studentButtons');
            const sortedStudents = studentData.slice().sort((a, b) => a.id.localeCompare(b.id));

            if (sortedStudents.length === 0) {
                studentButtons.innerHTML = '<p style="color: #999;">등록된 학생이 없습니다</p>';
                showChartPlaceholder();
                return;
            }

            studentButtons.innerHTML = sortedStudents.map(student => `
                <button class="student-btn" data-id="${student.id}" data-search="${student.id} ${student.name}"
                    onclick="selectStudent('${student.id}')" title="${student.id} ${student.name}">
                    ${student.id} ${student.name}
                </button>
            `).join('');

            selectStudent(sortedStudents[0].id);
        }

        // 검색어로 학생 버튼 필터링
        function filterStudentButtons() {
            const keyword = document.getElementById('studentSearch').value.trim().toLowerCase();
            document.querySelectorAll('.student-btn').forEach(btn => {
                const haystack = (btn.getAttribute('data-search') || '').toLowerCase();
                btn.style.display = haystack.includes(keyword) ? '' : 'none';
            });
        }

        // 보기 모드(월별/주별) 전환
        function setViewMode(mode) {
            viewMode = mode;
            document.getElementById('viewMonthlyBtn').classList.toggle('active', mode === 'monthly');
            document.getElementById('viewWeeklyBtn').classList.toggle('active', mode === 'weekly');
            if (currentStudent) {
                renderChart();
            }
        }

        // 학생 선택
        function selectStudent(studentId) {
            const student = studentData.find(s => s.id === studentId);
            if (!student) return;
            currentStudent = student;

            document.querySelectorAll('.student-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-id') === studentId);
            });

            renderChart();
        }

        // 차트 플레이스홀더
        function showChartPlaceholder() {
            const chartContainer = document.querySelector('.chart-container');
            chartContainer.innerHTML = '<div class="chart-placeholder">출석 기록이 없습니다. 학생들의 출석을 기록해주세요.</div>';
            document.getElementById('statsCards').innerHTML = '';
            if (chart) {
                chart.destroy();
                chart = null;
            }
        }

        // 이번 주 월요일 구하기
        function getMondayOf(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diffToMonday = (day === 0 ? -6 : 1) - day;
            d.setDate(d.getDate() + diffToMonday);
            d.setHours(0, 0, 0, 0);
            return d;
        }

        function formatWeekLabel(monday) {
            return `${monday.getMonth() + 1}/${monday.getDate()}`;
        }

        // 월별 데이터 계산 (학생 개인 + 전체 평균)
        function getMonthlyChartData(studentId) {
            const attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords') || '[]');
            const allMonths = [];
            for (let i = 1; i <= 12; i++) allMonths.push(`${i}월`);

            const studentMonthly = {};
            const totalMonthly = {};

            attendanceRecords.forEach(record => {
                const [, month] = record.date.split('-');
                const monthKey = `${parseInt(month, 10)}월`;
                totalMonthly[monthKey] = (totalMonthly[monthKey] || 0) + 1;
                if (record.id === studentId) {
                    studentMonthly[monthKey] = (studentMonthly[monthKey] || 0) + 1;
                }
            });

            const totalStudents = studentData.length || 1;
            const studentSeries = allMonths.map(m => studentMonthly[m] || 0);
            const avgSeries = allMonths.map(m => +((totalMonthly[m] || 0) / totalStudents).toFixed(2));

            return { labels: allMonths, studentSeries, avgSeries };
        }

        // 주별 데이터 계산 (최근 12주, 학생 개인 + 전체 평균)
        function getWeeklyChartData(studentId, weekCount = 12) {
            const attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords') || '[]');
            const currentMonday = getMondayOf(new Date());

            const weeks = [];
            for (let i = weekCount - 1; i >= 0; i--) {
                const monday = new Date(currentMonday);
                monday.setDate(currentMonday.getDate() - i * 7);
                weeks.push(monday);
            }

            const studentWeekly = {};
            const totalWeekly = {};

            attendanceRecords.forEach(record => {
                const key = getMondayOf(record.date).getTime();
                totalWeekly[key] = (totalWeekly[key] || 0) + 1;
                if (record.id === studentId) {
                    studentWeekly[key] = (studentWeekly[key] || 0) + 1;
                }
            });

            const totalStudents = studentData.length || 1;
            const labels = weeks.map(formatWeekLabel);
            const studentSeries = weeks.map(w => studentWeekly[w.getTime()] || 0);
            const avgSeries = weeks.map(w => +((totalWeekly[w.getTime()] || 0) / totalStudents).toFixed(2));

            return { labels, studentSeries, avgSeries };
        }

        // 요약 통계 카드 렌더링
        function renderStatsCards(studentId) {
            const attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords') || '[]');
            const studentRecords = attendanceRecords.filter(r => r.id === studentId);
            const totalClassDays = new Set(attendanceRecords.map(r => r.date)).size;
            const attendedDays = new Set(studentRecords.map(r => r.date)).size;
            const absentDays = Math.max(totalClassDays - attendedDays, 0);
            const rate = totalClassDays > 0 ? Math.round((attendedDays / totalClassDays) * 100) : null;

            let lastDateLabel = '기록 없음';
            if (studentRecords.length > 0) {
                const lastDate = studentRecords.map(r => r.date).sort().pop();
                const daysAgo = Math.round((new Date().setHours(0,0,0,0) - new Date(lastDate).setHours(0,0,0,0)) / 86400000);
                lastDateLabel = daysAgo === 0 ? `${lastDate} (오늘)` : `${lastDate} (${daysAgo}일 전)`;
            }

            const cards = [
                { value: attendedDays, label: '총 출석 횟수', muted: false },
                { value: absentDays, label: '결석 횟수 (진행된 수업 기준)', muted: true },
                { value: rate === null ? '-' : `${rate}%`, label: '출석률', muted: false },
                { value: lastDateLabel, label: '최근 출석일', muted: true }
            ];

            document.getElementById('statsCards').innerHTML = cards.map(c => `
                <div class="stat-card ${c.muted ? 'muted' : ''}">
                    <div class="stat-card-value">${c.value}</div>
                    <div class="stat-card-label">${c.label}</div>
                </div>
            `).join('');
        }

        // 현재 선택된 학생 + 보기 모드에 따라 차트/통계 렌더링
        function renderChart() {
            if (!currentStudent) return;
            const { id, name } = currentStudent;

            renderStatsCards(id);

            const { labels, studentSeries, avgSeries } = viewMode === 'weekly'
                ? getWeeklyChartData(id)
                : getMonthlyChartData(id);

            const periodLabel = viewMode === 'weekly' ? '주별' : '월별';

            const chartContainer = document.querySelector('.chart-container');
            chartContainer.innerHTML = '<canvas id="attendanceChart"></canvas>';
            const ctx = document.getElementById('attendanceChart').getContext('2d');

            if (chart) {
                chart.destroy();
            }

            const gradient = ctx.createLinearGradient(0, 0, 0, 350);
            gradient.addColorStop(0, 'rgba(245, 87, 108, 0.35)');
            gradient.addColorStop(1, 'rgba(245, 87, 108, 0.02)');

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: `${name}의 ${periodLabel} 출석 횟수`,
                            data: studentSeries,
                            borderColor: '#f5576c',
                            backgroundColor: gradient,
                            borderWidth: 3,
                            fill: true,
                            tension: 0.35,
                            pointRadius: 5,
                            pointBackgroundColor: '#f5576c',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2,
                            pointHoverRadius: 7
                        },
                        {
                            label: '전체 학생 평균',
                            data: avgSeries,
                            borderColor: '#999',
                            backgroundColor: 'transparent',
                            borderWidth: 2,
                            borderDash: [6, 4],
                            fill: false,
                            tension: 0.35,
                            pointRadius: 3,
                            pointBackgroundColor: '#999',
                            pointHoverRadius: 5
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    plugins: {
                        legend: {
                            labels: {
                                font: { size: 13, weight: 'bold' }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `${context.dataset.label}: ${context.parsed.y}회`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            }
                        }
                    }
                }
            });
        }

        // 이름 추가
        function addName() {
            const nameList = document.getElementById('nameList');
            const newItem = document.createElement('div');
            newItem.className = 'list-item';
            newItem.innerHTML = `
                <input type="text" placeholder="새 이름을 입력하세요" data-type="name">
                <button class="btn-delete" onclick="this.parentElement.remove()">삭제</button>
            `;
            nameList.appendChild(newItem);
        }

        // 이름 삭제
        function deleteName(index) {
            const names = Array.from(document.querySelectorAll('#nameList input')).map(input => input.value);
            names.splice(index, 1);

            const nameList = document.getElementById('nameList');
            nameList.innerHTML = names.map((name, idx) => `
                <div class="list-item">
                    <input type="text" value="${name}" data-type="name">
                    <button class="btn-delete" onclick="deleteName(${idx})">삭제</button>
                </div>
            `).join('');
        }

        // 학번 추가
        function addId() {
            const idList = document.getElementById('idList');
            const newItem = document.createElement('div');
            newItem.className = 'list-item';
            newItem.innerHTML = `
                <input type="text" placeholder="새 학번을 입력하세요" data-type="id">
                <button class="btn-delete" onclick="this.parentElement.remove()">삭제</button>
            `;
            idList.appendChild(newItem);
        }

        // 학번 삭제
        function deleteId(index) {
            const ids = Array.from(document.querySelectorAll('#idList input')).map(input => input.value);
            ids.splice(index, 1);

            const idList = document.getElementById('idList');
            idList.innerHTML = ids.map((id, idx) => `
                <div class="list-item">
                    <input type="text" value="${id}" data-type="id">
                    <button class="btn-delete" onclick="deleteId(${idx})">삭제</button>
                </div>
            `).join('');
        }

        // 로컬 백업
        function backupData() {
            const attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords') || '[]');
            const backupData = {
                backupDate: new Date().toISOString(),
                records: attendanceRecords
            };

            const dataStr = JSON.stringify(backupData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `attendance-backup-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showStatus('✅ 로컬 백업 완료!', 'success');
        }

        // 로컬 복구
        function restoreData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const backupData = JSON.parse(e.target.result);
                    if (backupData.records && Array.isArray(backupData.records)) {
                        localStorage.setItem('attendanceRecords', JSON.stringify(backupData.records));
                        showStatus('✅ 로컬 복구 완료!', 'success');
                        location.reload();
                    } else {
                        showStatus('❌ 올바른 백업 파일이 아닙니다', 'error');
                    }
                } catch (error) {
                    showStatus('❌ 파일을 읽을 수 없습니다', 'error');
                }
            };
            reader.readAsText(file);

            event.target.value = '';
        }

        // 로그아웃
        function logout() {
            window.location.href = 'index.html';
        }

        // 모달 바깥 클릭 시 닫기
        window.onclick = function(event) {
            const modal = document.getElementById('settingsModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
