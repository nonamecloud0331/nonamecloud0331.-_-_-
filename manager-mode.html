<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="관리자 모드 - 출석 관리">
    <title>관리자 모드 - 출석 관리</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header-title {
            font-size: 36px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            margin-bottom: 10px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .logout-btn, .backup-btn, .restore-btn, .sync-btn, .settings-btn {
            background: white;
            color: #f5576c;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            display: inline-block;
            font-size: 14px;
        }

        .logout-btn:hover, .backup-btn:hover, .restore-btn:hover, .sync-btn:hover, .settings-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .sync-btn.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        .section-title {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #f5576c;
        }

        /* 테이블 스타일 */
        .table-wrapper {
            overflow-x: auto;
            max-height: 500px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        table thead {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border: 1px solid #ddd;
        }

        table td {
            padding: 12px;
            border: 1px solid #eee;
        }

        table tbody tr {
            transition: background-color 0.3s ease;
        }

        table tbody tr:hover {
            background-color: #f9f9f9;
        }

        table tbody tr:nth-child(even) {
            background-color: #f5f5f5;
        }

        .no-data {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        /* 리스트 2, 3 스타일 */
        .editable-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .list-item {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .list-item .field-label {
            font-size: 13px;
            font-weight: 700;
            color: #667eea;
            white-space: nowrap;
        }

        .list-item input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .list-item input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .btn-delete:hover {
            background: #d32f2f;
            transform: scale(1.05);
        }

        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-top: 10px;
            width: 100%;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        /* 버튼들의 모임 */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .student-btn {
            padding: 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #333;
            transition: all 0.3s ease;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .student-btn:hover {
            background: #f0f0f0;
            border-color: #f5576c;
        }

        .student-btn.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-color: #f5576c;
        }

        .chart-container {
            position: relative;
            height: 350px;
            margin-top: 20px;
        }

        .student-search {
            width: 100%;
            padding: 12px 15px;
            font-size: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: border-color 0.3s ease;
        }

        .student-search:focus {
            outline: none;
            border-color: #f5576c;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }

        .stat-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 6px 16px rgba(245, 87, 108, 0.25);
        }

        .stat-card.muted {
            background: linear-gradient(135deg, #a8a8a8 0%, #7a7a7a 100%);
        }

        .stat-card-value {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .stat-card-label {
            font-size: 12px;
            opacity: 0.9;
        }

        .view-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .view-toggle-btn {
            padding: 10px 18px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            color: #666;
            transition: all 0.3s ease;
        }

        .view-toggle-btn:hover {
            border-color: #f5576c;
        }

        .view-toggle-btn.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-color: #f5576c;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .chart-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 350px;
            color: #999;
            font-size: 18px;
            background: #f9f9f9;
            border-radius: 10px;
            border: 2px dashed #ddd;
        }

        .status-message {
            text-align: center;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        #restoreFileInput {
            display: none;
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }
        }

        /* 스크롤바 스타일 */
        .table-wrapper::-webkit-scrollbar,
        .editable-list::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .table-wrapper::-webkit-scrollbar-track,
        .editable-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .table-wrapper::-webkit-scrollbar-thumb,
        .editable-list::-webkit-scrollbar-thumb {
            background: #f5576c;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <script>
        // 인증 확인: manager-password.html을 거치지 않고 이 페이지로 직접 들어오는 것을 차단
        (function () {
            const AUTH_SESSION_LIMIT = 2 * 60 * 60 * 1000; // 2시간
            const isAuthenticated = sessionStorage.getItem('managerAuthenticated') === 'true';
            const authTime = parseInt(sessionStorage.getItem('managerAuthTime') || '0', 10);
            const isExpired = !authTime || (Date.now() - authTime) > AUTH_SESSION_LIMIT;

            if (!isAuthenticated || isExpired) {
                sessionStorage.removeItem('managerAuthenticated');
                sessionStorage.removeItem('managerAuthTime');
                window.location.replace('manager-password.html');
            }
        })();
    </script>
    <div class="header">
        <div class="header-title">📊 관리자 모드</div>
        <div class="header-buttons">
            <button class="backup-btn" onclick="backupData()">💾 로컬 백업</button>
            <button class="restore-btn" onclick="document.getElementById('restoreFileInput').click()">📂 로컬 복구</button>
            <button class="sync-btn" id="refreshBtn" onclick="fetchAttendanceFromSupabase(true)">🔄 새로고침</button>
            <a class="sync-btn" href="https://supabase.com/dashboard/project/patxdjdibfqyucclhrde" target="_blank" rel="noopener" style="text-decoration:none;">🗄️ Supabase 바로가기</a>
            <span id="realtimeStatus" style="color: white; font-size: 13px; align-self: center;">● 실시간 연결 중...</span>
            <button class="logout-btn" onclick="logout()">로그아웃</button>
        </div>
        <div id="statusMessage"></div>
        <input type="file" id="restoreFileInput" accept=".json" onchange="restoreData(event)">
    </div>

    <div class="main-container">
        <!-- 출석 기록 (표 형식) -->
        <div class="section full-width">
            <div class="section-title">📋 출석 기록</div>
            <div class="table-wrapper">
                <table id="attendanceTable">
                    <thead>
                        <tr>
                            <th>날짜</th>
                            <th>시간</th>
                            <th>학번</th>
                            <th>이름</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTableBody">
                        <tr>
                            <td colspan="4" class="no-data">출석 기록이 없습니다</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 학생 관리 -->
        <div class="section full-width">
            <div class="section-title">👤 학생 리스트 (학번 + 이름)</div>
            <div class="editable-list" id="studentList"></div>
            <button class="btn-add" onclick="addStudent()">+ 학생 추가</button>
        </div>

        <!-- 개인별 출석 그래프 -->
        <div class="section full-width">
            <div class="section-title">📈 학생별 출석 현황</div>

            <input type="text" id="studentSearch" class="student-search" placeholder="🔍 학번 또는 이름으로 검색..." oninput="filterStudentButtons()">

            <div class="buttons-grid" id="studentButtons"></div>

            <div id="statsCards" class="stats-cards"></div>

            <div class="view-toggle">
                <button class="view-toggle-btn active" id="viewMonthlyBtn" onclick="setViewMode('monthly')">월별 보기</button>
                <button class="view-toggle-btn" id="viewWeeklyBtn" onclick="setViewMode('weekly')">주별 보기 (최근 12주)</button>
            </div>

            <div class="chart-container">
                <canvas id="attendanceChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let chart = null;

        // 학생 명단 (Supabase students 테이블에서 불러옴)
        let studentData = [];

        // Supabase 연결 설정
        const SUPABASE_URL = 'https://patxdjdibfqyucclhrde.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhdHhkamRpYmZxeXVjY2xocmRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0OTM1NTgsImV4cCI6MjA5OTA2OTU1OH0.-NHStGhdXLv1KCLQLNKTExFTVZeSU5x7AlfkysPuEs0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentStudent = null; // { id, name }
        let viewMode = 'monthly'; // 'monthly' | 'weekly'

        // 페이지 로드 시 초기화
        window.addEventListener('load', async function() {
            loadDataFromLocalStorage();
            await fetchStudentsFromSupabase();
            fetchAttendanceFromSupabase();
            subscribeToRealtimeUpdates();
        });

        // Supabase에서 학생 명단 불러오기
        async function fetchStudentsFromSupabase() {
            try {
                const { data, error } = await supabaseClient
                    .from('students')
                    .select('*')
                    .order('student_id', { ascending: true });

                if (error) throw error;

                studentData = (data || []).map(row => ({ id: row.student_id, name: row.name }));
                loadStudentLists();
                loadStudentButtons();
            } catch (error) {
                showStatus(`❌ 학생 명단 조회 오류: ${error.message}`, 'error');
                console.error('학생 명단 조회 오류:', error);
            }
        }

        // Supabase에서 전체 출석 기록 불러오기
        async function fetchAttendanceFromSupabase(showToast) {
            try {
                const { data, error } = await supabaseClient
                    .from('attendance')
                    .select('*')
                    .order('date', { ascending: false })
                    .order('time', { ascending: false });

                if (error) throw error;

                // 기존 화면 렌더링 코드가 쓰던 형식({date, time, id, name})으로 변환
                const records = (data || []).map(row => ({
                    date: row.date,
                    time: row.time,
                    id: row.student_id,
                    name: row.name,
                    timestamp: new Date(row.created_at).getTime()
                }));

                localStorage.setItem('attendanceRecords', JSON.stringify(records));
                loadAttendanceRecords();
                loadStudentButtons();

                if (showToast) {
                    showStatus('✅ Supabase에서 최신 데이터를 불러왔습니다!', 'success');
                }
            } catch (error) {
                const detail = error?.message || JSON.stringify(error);
                const hint = error?.code === 'PGRST205' || /schema cache/i.test(detail)
                    ? ' (테이블을 못 찾았어요. Supabase 프로젝트에 attendance 테이블이 있는지 확인해주세요)'
                    : (window.location.protocol === 'file:'
                        ? ' (⚠️ 파일을 더블클릭해서 여신 것 같아요. GitHub Pages 주소로 접속해서 확인해주세요)'
                        : '');
                showStatus(`❌ Supabase 조회 오류: ${detail}${hint}`, 'error');
                console.error('Supabase 조회 오류 상세:', error);
            }
        }

        // 실시간 구독: 학생이 출석하거나 명단이 바뀌면 새로고침 없이 바로 반영
        function subscribeToRealtimeUpdates() {
            const statusEl = document.getElementById('realtimeStatus');

            supabaseClient
                .channel('attendance-changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'attendance' }, () => {
                    fetchAttendanceFromSupabase();
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'students' }, () => {
                    fetchStudentsFromSupabase();
                })
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        statusEl.textContent = '● 실시간 연결됨';
                        statusEl.style.color = '#c8ffc8';
                    } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                        statusEl.textContent = '● 실시간 연결 끊김 (새로고침 버튼을 눌러주세요)';
                        statusEl.style.color = '#ffd6d6';
                    }
                });
        }

        // 상태 메시지 표시
        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = `status-message status-${type}`;
            setTimeout(() => {
                statusDiv.textContent = '';
                statusDiv.className = '';
            }, 3000);
        }

        // 로컬 스토리지에서 데이터 로드
        function loadDataFromLocalStorage() {
            const attendanceRecords = localStorage.getItem('attendanceRecords');
            if (!attendanceRecords) {
                localStorage.setItem('attendanceRecords', JSON.stringify([]));
            }
        }

        // 출석 기록 로드
        function loadAttendanceRecords() {
            const attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords') || '[]');
            const tableBody = document.getElementById('attendanceTableBody');

            if (attendanceRecords.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="4" class="no-data">출석 기록이 없습니다</td></tr>';
                return;
            }

            tableBody.innerHTML = attendanceRecords.map(record => `
                <tr>
                    <td>${record.date}</td>
                    <td>${record.time}</td>
                    <td>${record.id}</td>
                    <td>${record.name}</td>
                </tr>
            `).join('');
        }

        // 학생 리스트 로드 (학번 + 이름을 한 줄에)
        function loadStudentLists() {
            renderStudentListRows(studentData.slice().sort((a, b) => a.id.localeCompare(b.id)));
        }

        function renderStudentListRows(students) {
            const studentList = document.getElementById('studentList');
            studentList.innerHTML = students.map(s => `
                <div class="list-item" data-original-id="${s.id}">
                    <span class="field-label">학번</span>
                    <input type="text" value="${s.id}" placeholder="학번" data-type="id">
                    <span class="field-label">이름</span>
                    <input type="text" value="${s.name}" placeholder="이름" data-type="name">
                    <button class="btn-add" style="width:auto; margin:0; padding:8px 12px;" onclick="saveStudentRow(this)">저장</button>
                    <button class="btn-delete" onclick="deleteStudentRow(this)">삭제</button>
                </div>
            `).join('');
        }

        // 새 학생 행 추가 (빈 행, 아직 Supabase에 저장 전)
        function addStudent() {
            const studentList = document.getElementById('studentList');
            const newItem = document.createElement('div');
            newItem.className = 'list-item';
            newItem.setAttribute('data-original-id', '');
            newItem.innerHTML = `
                <span class="field-label">학번</span>
                <input type="text" placeholder="학번" data-type="id">
                <span class="field-label">이름</span>
                <input type="text" placeholder="이름" data-type="name">
                <button class="btn-add" style="width:auto; margin:0; padding:8px 12px;" onclick="saveStudentRow(this)">저장</button>
                <button class="btn-delete" onclick="deleteStudentRow(this)">삭제</button>
            `;
            studentList.appendChild(newItem);
        }

        // 학생 행 저장 (Supabase students 테이블에 반영)
        async function saveStudentRow(button) {
            const row = button.closest('.list-item');
            const idInput = row.querySelector('input[data-type="id"]');
            const nameInput = row.querySelector('input[data-type="name"]');
            const newId = idInput.value.trim();
            const newName = nameInput.value.trim();
            const originalId = row.getAttribute('data-original-id') || '';

            if (!newId || !newName) {
                alert('학번과 이름을 모두 입력해주세요.');
                return;
            }

            button.disabled = true;
            try {
                // 학번이 변경된 경우, 기존 행을 지우고 새로 만든다
                if (originalId && originalId !== newId) {
                    const { error: deleteError } = await supabaseClient
                        .from('students')
                        .delete()
                        .eq('student_id', originalId);
                    if (deleteError) throw deleteError;
                }

                const { error } = await supabaseClient
                    .from('students')
                    .upsert({ student_id: newId, name: newName }, { onConflict: 'student_id' });
                if (error) throw error;

                showStatus('✅ 학생 정보가 저장되었습니다!', 'success');
                await fetchStudentsFromSupabase();
            } catch (error) {
                showStatus(`❌ 저장 오류: ${error.message}`, 'error');
                console.error('학생 저장 오류:', error);
                button.disabled = false;
            }
        }

        // 학생 행 삭제 (저장 안 된 빈 행이면 화면에서만 제거, 저장된 행이면 Supabase에서도 삭제)
        async function deleteStudentRow(button) {
            const row = button.closest('.list-item');
            const originalId = row.getAttribute('data-original-id') || '';

            if (!originalId) {
                row.remove();
                return;
            }

            if (!confirm(`학번 ${originalId} 학생을 정말 삭제하시겠습니까? 해당 학생의 출석 기록은 남아있습니다.`)) {
                return;
            }

            button.disabled = true;
            try {
                const { error } = await supabaseClient
                    .from('students')
                    .delete()
                    .eq('student_id', originalId);
                if (error) throw error;

                showStatus('✅ 학생이 삭제되었습니다!', 'success');
                await fetchStudentsFromSupabase();
            } catch (error) {
                showStatus(`❌ 삭제 오류: ${error.message}`, 'error');
                console.error('학생 삭제 오류:', error);
                button.disabled = false;
            }
        }

        // 학생 버튼 로드 (등록된 전체 학생 기준, 출석 기록 유무와 무관)
        function loadStudentButtons() {
            const studentButtons = document.getElementById('studentButtons');
            const sortedStudents = studentData.slice().sort((a, b) => a.id.localeCompare(b.id));

            if (sortedStudents.length === 0) {
                studentButtons.innerHTML = '<p style="color: #999;">등록된 학생이 없습니다</p>';
                showChartPlaceholder();
                return;
            }

            studentButtons.innerHTML = sortedStudents.map(student => `
                <button class="student-btn" data-id="${student.id}" data-search="${student.id} ${student.name}"
                    onclick="selectStudent('${student.id}')" title="${student.id} ${student.name}">
                    ${student.id} ${student.name}
                </button>
            `).join('');

            // 기존에 선택 중이던 학생이 명단에 여전히 있으면 그 학생을 유지, 없으면 첫 번째 학생 선택
            const stillExists = currentStudent && sortedStudents.some(s => s.id === currentStudent.id);
            selectStudent(stillExists ? currentStudent.id : sortedStudents[0].id);
        }

        // 검색어로 학생 버튼 필터링
        function filterStudentButtons() {
            const keyword = document.getElementById('studentSearch').value.trim().toLowerCase();
            document.querySelectorAll('.student-btn').forEach(btn => {
                const haystack = (btn.getAttribute('data-search') || '').toLowerCase();
                btn.style.display = haystack.includes(keyword) ? '' : 'none';
            });
        }

        // 보기 모드(월별/주별) 전환
        function setViewMode(mode) {
            viewMode = mode;
            document.getElementById('viewMonthlyBtn').classList.toggle('active', mode === 'monthly');
            document.getElementById('viewWeeklyBtn').classList.toggle('active', mode === 'weekly');
            if (currentStudent) {
                renderChart();
            }
        }

        // 학생 선택
        function selectStudent(studentId) {
            const student = studentData.find(s => s.id === studentId);
            if (!student) return;
            currentStudent = student;

            document.querySelectorAll('.student-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-id') === studentId);
            });

            renderChart();
        }

        // 차트 플레이스홀더
        function showChartPlaceholder() {
            const chartContainer = document.querySelector('.chart-container');
            chartContainer.innerHTML = '<div class="chart-placeholder">출석 기록이 없습니다. 학생들의 출석을 기록해주세요.</div>';
            document.getElementById('statsCards').innerHTML = '';
            if (chart) {
                chart.destroy();
                chart = null;
            }
        }

        // 이번 주 월요일 구하기
        function getMondayOf(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diffToMonday = (day === 0 ? -6 : 1) - day;
            d.setDate(d.getDate() + diffToMonday);
            d.setHours(0, 0, 0, 0);
            return d;
        }

        function formatWeekLabel(monday) {
            return `${monday.getMonth() + 1}/${monday.getDate()}`;
        }

        // 월별 데이터 계산 (학생 개인 + 전체 평균)
        function getMonthlyChartData(studentId) {
            const attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords') || '[]');
            const allMonths = [];
            for (let i = 1; i <= 12; i++) allMonths.push(`${i}월`);

            const studentMonthly = {};
            const totalMonthly = {};

            attendanceRecords.forEach(record => {
                const [, month] = record.date.split('-');
                const monthKey = `${parseInt(month, 10)}월`;
                totalMonthly[monthKey] = (totalMonthly[monthKey] || 0) + 1;
                if (record.id === studentId) {
                    studentMonthly[monthKey] = (studentMonthly[monthKey] || 0) + 1;
                }
            });

            const totalStudents = studentData.length || 1;
            const studentSeries = allMonths.map(m => studentMonthly[m] || 0);
            const avgSeries = allMonths.map(m => +((totalMonthly[m] || 0) / totalStudents).toFixed(2));

            return { labels: allMonths, studentSeries, avgSeries };
        }

        // 주별 데이터 계산 (최근 12주, 학생 개인 + 전체 평균)
        function getWeeklyChartData(studentId, weekCount = 12) {
            const attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords') || '[]');
            const currentMonday = getMondayOf(new Date());

            const weeks = [];
            for (let i = weekCount - 1; i >= 0; i--) {
                const monday = new Date(currentMonday);
                monday.setDate(currentMonday.getDate() - i * 7);
                weeks.push(monday);
            }

            const studentWeekly = {};
            const totalWeekly = {};

            attendanceRecords.forEach(record => {
                const key = getMondayOf(record.date).getTime();
                totalWeekly[key] = (totalWeekly[key] || 0) + 1;
                if (record.id === studentId) {
                    studentWeekly[key] = (studentWeekly[key] || 0) + 1;
                }
            });

            const totalStudents = studentData.length || 1;
            const labels = weeks.map(formatWeekLabel);
            const studentSeries = weeks.map(w => studentWeekly[w.getTime()] || 0);
            const avgSeries = weeks.map(w => +((totalWeekly[w.getTime()] || 0) / totalStudents).toFixed(2));

            return { labels, studentSeries, avgSeries };
        }

        // 요약 통계 카드 렌더링
        function renderStatsCards(studentId) {
            const attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords') || '[]');
            const studentRecords = attendanceRecords.filter(r => r.id === studentId);
            const totalClassDays = new Set(attendanceRecords.map(r => r.date)).size;
            const attendedDays = new Set(studentRecords.map(r => r.date)).size;
            const absentDays = Math.max(totalClassDays - attendedDays, 0);
            const rate = totalClassDays > 0 ? Math.round((attendedDays / totalClassDays) * 100) : null;

            let lastDateLabel = '기록 없음';
            if (studentRecords.length > 0) {
                const lastDate = studentRecords.map(r => r.date).sort().pop();
                const daysAgo = Math.round((new Date().setHours(0,0,0,0) - new Date(lastDate).setHours(0,0,0,0)) / 86400000);
                lastDateLabel = daysAgo === 0 ? `${lastDate} (오늘)` : `${lastDate} (${daysAgo}일 전)`;
            }

            const cards = [
                { value: attendedDays, label: '총 출석 횟수', muted: false },
                { value: absentDays, label: '결석 횟수 (진행된 수업 기준)', muted: true },
                { value: rate === null ? '-' : `${rate}%`, label: '출석률', muted: false },
                { value: lastDateLabel, label: '최근 출석일', muted: true }
            ];

            document.getElementById('statsCards').innerHTML = cards.map(c => `
                <div class="stat-card ${c.muted ? 'muted' : ''}">
                    <div class="stat-card-value">${c.value}</div>
                    <div class="stat-card-label">${c.label}</div>
                </div>
            `).join('');
        }

        // 현재 선택된 학생 + 보기 모드에 따라 차트/통계 렌더링
        function renderChart() {
            if (!currentStudent) return;
            const { id, name } = currentStudent;

            renderStatsCards(id);

            const { labels, studentSeries, avgSeries } = viewMode === 'weekly'
                ? getWeeklyChartData(id)
                : getMonthlyChartData(id);

            const periodLabel = viewMode === 'weekly' ? '주별' : '월별';

            const chartContainer = document.querySelector('.chart-container');
            chartContainer.innerHTML = '<canvas id="attendanceChart"></canvas>';
            const ctx = document.getElementById('attendanceChart').getContext('2d');

            if (chart) {
                chart.destroy();
            }

            const gradient = ctx.createLinearGradient(0, 0, 0, 350);
            gradient.addColorStop(0, 'rgba(245, 87, 108, 0.35)');
            gradient.addColorStop(1, 'rgba(245, 87, 108, 0.02)');

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: `${name}의 ${periodLabel} 출석 횟수`,
                            data: studentSeries,
                            borderColor: '#f5576c',
                            backgroundColor: gradient,
                            borderWidth: 3,
                            fill: true,
                            tension: 0.35,
                            pointRadius: 5,
                            pointBackgroundColor: '#f5576c',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2,
                            pointHoverRadius: 7
                        },
                        {
                            label: '전체 학생 평균',
                            data: avgSeries,
                            borderColor: '#999',
                            backgroundColor: 'transparent',
                            borderWidth: 2,
                            borderDash: [6, 4],
                            fill: false,
                            tension: 0.35,
                            pointRadius: 3,
                            pointBackgroundColor: '#999',
                            pointHoverRadius: 5
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    plugins: {
                        legend: {
                            labels: {
                                font: { size: 13, weight: 'bold' }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `${context.dataset.label}: ${context.parsed.y}회`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            }
                        }
                    }
                }
            });
        }

        // 로컬 백업
        function backupData() {
            const attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords') || '[]');
            const backupData = {
                backupDate: new Date().toISOString(),
                records: attendanceRecords
            };

            const dataStr = JSON.stringify(backupData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            const now = new Date();
            const localDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            link.download = `attendance-backup-${localDate}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showStatus('✅ 로컬 백업 완료!', 'success');
        }

        // 로컬 복구
        function restoreData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const backupData = JSON.parse(e.target.result);
                    if (backupData.records && Array.isArray(backupData.records)) {
                        localStorage.setItem('attendanceRecords', JSON.stringify(backupData.records));
                        showStatus('✅ 로컬 복구 완료!', 'success');
                        location.reload();
                    } else {
                        showStatus('❌ 올바른 백업 파일이 아닙니다', 'error');
                    }
                } catch (error) {
                    showStatus('❌ 파일을 읽을 수 없습니다', 'error');
                }
            };
            reader.readAsText(file);

            event.target.value = '';
        }

        // 로그아웃
        function logout() {
            sessionStorage.removeItem('managerAuthenticated');
            sessionStorage.removeItem('managerAuthTime');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
