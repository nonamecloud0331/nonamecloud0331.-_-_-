<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="관리자 모드 - 출석 관리">
    <title>관리자 모드 - 출석 관리</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header-title {
            font-size: 36px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            margin-bottom: 10px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .logout-btn, .backup-btn, .restore-btn, .sync-btn {
            background: white;
            color: #f5576c;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            display: inline-block;
            font-size: 14px;
        }

        .logout-btn:hover, .backup-btn:hover, .restore-btn:hover, .sync-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .sync-btn.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        .section-title {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #f5576c;
        }

        /* 테이블 스타일 */
        .table-wrapper {
            overflow-x: auto;
            max-height: 500px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        table thead {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border: 1px solid #ddd;
        }

        table td {
            padding: 12px;
            border: 1px solid #eee;
        }

        table tbody tr {
            transition: background-color 0.3s ease;
        }

        table tbody tr:hover {
            background-color: #f9f9f9;
        }

        table tbody tr:nth-child(even) {
            background-color: #f5f5f5;
        }

        .no-data {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        /* 리스트 2, 3 스타일 */
        .editable-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .list-item {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .list-item .field-label {
            font-size: 13px;
            font-weight: 700;
            color: #667eea;
            white-space: nowrap;
        }

        .list-item input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .list-item input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .btn-delete:hover {
            background: #d32f2f;
            transform: scale(1.05);
        }

        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-top: 10px;
            width: 100%;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        /* 버튼들의 모임 */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .student-btn {
            padding: 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #333;
            transition: all 0.3s ease;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .student-btn:hover {
            background: #f0f0f0;
            border-color: #f5576c;
        }

        .student-btn.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-color: #f5576c;
        }

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 14px;
        }

        .calendar-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            min-width: 120px;
            text-align: center;
        }

        .calendar-nav-btn {
            width: 34px;
            height: 34px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            color: #666;
            transition: all 0.3s ease;
        }

        .calendar-nav-btn:hover {
            border-color: #f5576c;
            color: #f5576c;
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: #999;
            margin-bottom: 6px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: #f7f7f7;
            position: relative;
            font-size: 13px;
            color: #555;
        }

        .calendar-day.empty {
            background: transparent;
        }

        .calendar-day.attended {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            font-weight: bold;
        }

        .calendar-day.today {
            box-shadow: 0 0 0 2px #667eea inset;
        }

        .calendar-day-number {
            line-height: 1;
        }

        .calendar-check {
            font-size: 11px;
            margin-top: 2px;
        }

        .calendar-legend {
            display: flex;
            gap: 18px;
            justify-content: center;
            margin-top: 16px;
            font-size: 12px;
            color: #777;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            display: inline-block;
        }

        .legend-dot.attended {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .legend-dot.today {
            background: #f7f7f7;
            box-shadow: 0 0 0 2px #667eea inset;
        }

        .student-search {
            width: 100%;
            padding: 12px 15px;
            font-size: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: border-color 0.3s ease;
        }

        .student-search:focus {
            outline: none;
            border-color: #f5576c;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }

        .stat-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 6px 16px rgba(245, 87, 108, 0.25);
        }

        .stat-card.muted {
            background: linear-gradient(135deg, #a8a8a8 0%, #7a7a7a 100%);
        }

        .stat-card-value {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .stat-card-label {
            font-size: 12px;
            opacity: 0.9;
        }

        .page-toggle {
            display: flex;
            gap: 10px;
            margin: 20px 0 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }

        .page-toggle-btn {
            padding: 12px 22px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            color: #666;
            transition: all 0.3s ease;
        }

        .page-toggle-btn:hover {
            border-color: #667eea;
        }

        .page-toggle-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .journal-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 500px;
            overflow-y: auto;
        }

        .journal-entry {
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            border-radius: 8px;
            padding: 14px 16px;
        }

        .journal-entry-date {
            font-weight: bold;
            color: #333;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .journal-entry-text {
            color: #555;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .journal-entry-text.empty {
            color: #aaa;
            font-style: italic;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .status-message {
            text-align: center;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        #restoreFileInput {
            display: none;
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }
        }

        /* 스크롤바 스타일 */
        .table-wrapper::-webkit-scrollbar,
        .editable-list::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .table-wrapper::-webkit-scrollbar-track,
        .editable-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .table-wrapper::-webkit-scrollbar-thumb,
        .editable-list::-webkit-scrollbar-thumb {
            background: #f5576c;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <script>
        // 인증 확인: manager-password.html을 거치지 않고 이 페이지로 직접 들어오는 것을 차단
        (function () {
            const AUTH_SESSION_LIMIT = 2 * 60 * 60 * 1000; // 2시간
            const isAuthenticated = sessionStorage.getItem('managerAuthenticated') === 'true';
            const authTime = parseInt(sessionStorage.getItem('managerAuthTime') || '0', 10);
            const isExpired = !authTime || (Date.now() - authTime) > AUTH_SESSION_LIMIT;

            if (!isAuthenticated || isExpired) {
                sessionStorage.removeItem('managerAuthenticated');
                sessionStorage.removeItem('managerAuthTime');
                window.location.replace('manager-password.html');
            }
        })();
    </script>
    <div class="header">
        <div class="header-title">📊 관리자 모드</div>
        <div class="header-buttons">
            <button class="backup-btn" onclick="backupData()">💾 로컬 백업</button>
            <button class="restore-btn" onclick="document.getElementById('restoreFileInput').click()">📂 로컬 복구</button>
            <button class="sync-btn" id="refreshBtn" onclick="fetchAttendanceFromSupabase(true)">🔄 새로고침</button>
            <a class="sync-btn" href="https://supabase.com/dashboard/project/patxdjdibfqyucclhrde" target="_blank" rel="noopener" style="text-decoration:none;">🗄️ Supabase 바로가기</a>
            <button class="sync-btn" id="deleteAllBtn" style="background:#ff6b6b; color:white;" onclick="deleteAllAttendance()">🗑️ 전체 출석 기록 삭제</button>
            <span id="realtimeStatus" style="color: white; font-size: 13px; align-self: center;">● 실시간 연결 중...</span>
            <button class="logout-btn" onclick="logout()">로그아웃</button>
        </div>
        <div id="statusMessage"></div>
        <input type="file" id="restoreFileInput" accept=".json" onchange="restoreData(event)">
    </div>

    <div class="main-container">
        <!-- 출석 기록 (표 형식) -->
        <div class="section full-width">
            <div class="section-title">📋 출석 기록</div>
            <div class="table-wrapper">
                <table id="attendanceTable">
                    <thead>
                        <tr>
                            <th>날짜</th>
                            <th>시간</th>
                            <th>학번</th>
                            <th>이름</th>
                            <th>일지</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTableBody">
                        <tr>
                            <td colspan="5" class="no-data">출석 기록이 없습니다</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 학생 관리 -->
        <div class="section full-width">
            <div class="section-title">👤 학생 리스트 (학번 + 이름)</div>
            <div class="editable-list" id="studentList"></div>
            <button class="btn-add" onclick="addStudent()">+ 학생 추가</button>
        </div>

        <!-- 개인별 출석 그래프 + 일지 -->
        <div class="section full-width">
            <div class="section-title">📈 학생별 출석 현황</div>

            <input type="text" id="studentSearch" class="student-search" placeholder="🔍 학번 또는 이름으로 검색..." oninput="filterStudentButtons()">

            <div class="buttons-grid" id="studentButtons"></div>

            <div class="page-toggle">
                <button class="page-toggle-btn active" id="pageGraphBtn" onclick="setPageMode('graph')">📈 그래프</button>
                <button class="page-toggle-btn" id="pageJournalBtn" onclick="setPageMode('journal')">📔 하루 일지</button>
            </div>

            <div id="graphPage">
                <div id="statsCards" class="stats-cards"></div>

                <div class="calendar-header">
                    <button class="calendar-nav-btn" onclick="changeCalendarMonth(-1)" aria-label="이전 달">◀</button>
                    <div class="calendar-title" id="calendarTitle">-</div>
                    <button class="calendar-nav-btn" onclick="changeCalendarMonth(1)" aria-label="다음 달">▶</button>
                </div>

                <div class="calendar-weekdays">
                    <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
                </div>

                <div class="calendar-grid" id="calendarGrid"></div>

                <div class="calendar-legend">
                    <span class="legend-item"><span class="legend-dot attended"></span> 출석</span>
                    <span class="legend-item"><span class="legend-dot today"></span> 오늘</span>
                </div>
            </div>

            <div id="journalPage" style="display:none;">
                <div id="journalList" class="journal-list"></div>
            </div>
        </div>
    </div>

    <script>
        // 학생 명단 (Supabase students 테이블에서 불러옴)
        let studentData = [];

        // Supabase 연결 설정
        const SUPABASE_URL = 'https://patxdjdibfqyucclhrde.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhdHhkamRpYmZxeXVjY2xocmRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0OTM1NTgsImV4cCI6MjA5OTA2OTU1OH0.-NHStGhdXLv1KCLQLNKTExFTVZeSU5x7AlfkysPuEs0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentStudent = null; // { id, name }
        let calendarDate = new Date(); // 달력에 현재 표시 중인 월
        let pageMode = 'graph'; // 'graph' | 'journal'

        // 페이지 로드 시 초기화
        window.addEventListener('load', async function() {
            loadDataFromLocalStorage();
            await fetchStudentsFromSupabase();
            fetchAttendanceFromSupabase();
            subscribeToRealtimeUpdates();
        });

        // Supabase에서 학생 명단 불러오기
        async function fetchStudentsFromSupabase() {
            try {
                const { data, error } = await supabaseClient
                    .from('students')
                    .select('*')
                    .order('student_id', { ascending: true });

                if (error) throw error;

                studentData = (data || []).map(row => ({ id: row.student_id, name: row.name }));
                loadStudentLists();
                loadStudentButtons();
            } catch (error) {
                showStatus(`❌ 학생 명단 조회 오류: ${error.message}`, 'error');
                console.error('학생 명단 조회 오류:', error);
            }
        }

        // Supabase에서 전체 출석 기록 불러오기
        async function fetchAttendanceFromSupabase(showToast) {
            try {
                const { data, error } = await supabaseClient
                    .from('attendance')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                // 기존 화면 렌더링 코드가 쓰던 형식({date, time, id, name})으로 변환
                const records = (data || []).map(row => ({
                    date: row.date,
                    time: row.time,
                    id: row.student_id,
                    name: row.name,
                    journal: row.journal || '',
                    timestamp: new Date(row.created_at).getTime()
                }));

                localStorage.setItem('attendanceRecords', JSON.stringify(records));
                loadAttendanceRecords();
                loadStudentButtons();
                if (pageMode === 'journal' && currentStudent) {
                    renderJournalPage(currentStudent.id);
                }

                if (showToast) {
                    showStatus('✅ Supabase에서 최신 데이터를 불러왔습니다!', 'success');
                }
            } catch (error) {
                const detail = error?.message || JSON.stringify(error);
                const hint = error?.code === 'PGRST205' || /schema cache/i.test(detail)
                    ? ' (테이블을 못 찾았어요. Supabase 프로젝트에 attendance 테이블이 있는지 확인해주세요)'
                    : (window.location.protocol === 'file:'
                        ? ' (⚠️ 파일을 더블클릭해서 여신 것 같아요. GitHub Pages 주소로 접속해서 확인해주세요)'
                        : '');
                showStatus(`❌ Supabase 조회 오류: ${detail}${hint}`, 'error');
                console.error('Supabase 조회 오류 상세:', error);
            }
        }

        // 전체 출석 기록 삭제 (2단계 확인: 확인창 → "삭제" 직접 입력)
        async function deleteAllAttendance() {
            const attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords') || '[]');
            const count = attendanceRecords.length;

            if (count === 0) {
                alert('삭제할 출석 기록이 없습니다.');
                return;
            }

            // 1단계: 몇 건이 지워지는지 명확히 보여주고 확인
            const firstConfirm = confirm(
                `⚠️ 전체 출석 기록 ${count}건을 정말 삭제하시겠습니까?\n\n이 작업은 되돌릴 수 없습니다. 학생 명단(학번/이름)은 삭제되지 않고, 출석 기록만 전부 삭제됩니다.`
            );
            if (!firstConfirm) return;

            // 2단계: "삭제"를 직접 입력해야 진행 (실수 클릭 방지)
            const typed = prompt(
                `정말로 진행하려면 아래 칸에 정확히 "삭제"라고 입력해주세요.\n(${count}건의 출석 기록이 영구적으로 삭제됩니다)`
            );
            if (typed !== '삭제') {
                alert('입력이 일치하지 않아 취소되었습니다. 출석 기록은 삭제되지 않았습니다.');
                return;
            }

            const deleteBtn = document.getElementById('deleteAllBtn');
            deleteBtn.disabled = true;
            deleteBtn.textContent = '⏳ 삭제 중...';

            try {
                const { error } = await supabaseClient
                    .from('attendance')
                    .delete()
                    .gt('id', 0); // id는 항상 0보다 크므로 사실상 전체 삭제

                if (error) throw error;

                showStatus(`✅ 출석 기록 ${count}건이 전부 삭제되었습니다!`, 'success');
                await fetchAttendanceFromSupabase();
            } catch (error) {
                showStatus(`❌ 삭제 오류: ${error.message}`, 'error');
                console.error('전체 삭제 오류:', error);
            } finally {
                deleteBtn.disabled = false;
                deleteBtn.textContent = '🗑️ 전체 출석 기록 삭제';
            }
        }

        // 실시간 구독: 학생이 출석하거나 명단이 바뀌면 새로고침 없이 바로 반영
        function subscribeToRealtimeUpdates() {
            const statusEl = document.getElementById('realtimeStatus');

            supabaseClient
                .channel('attendance-changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'attendance' }, () => {
                    fetchAttendanceFromSupabase();
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'students' }, () => {
                    fetchStudentsFromSupabase();
                })
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        statusEl.textContent = '● 실시간 연결됨';
                        statusEl.style.color = '#c8ffc8';
                    } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                        statusEl.textContent = '● 실시간 연결 끊김 (새로고침 버튼을 눌러주세요)';
                        statusEl.style.color = '#ffd6d6';
                    }
                });
        }

        // 상태 메시지 표시
        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = `status-message status-${type}`;
            setTimeout(() => {
                statusDiv.textContent = '';
                statusDiv.className = '';
            }, 3000);
        }

        // 로컬 스토리지에서 데이터 로드
        function loadDataFromLocalStorage() {
            const attendanceRecords = localStorage.getItem('attendanceRecords');
            if (!attendanceRecords) {
                localStorage.setItem('attendanceRecords', JSON.stringify([]));
            }
        }

        // 출석 기록 로드
        function loadAttendanceRecords() {
            const attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords') || '[]');
            const tableBody = document.getElementById('attendanceTableBody');

            if (attendanceRecords.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" class="no-data">출석 기록이 없습니다</td></tr>';
                return;
            }

            tableBody.innerHTML = attendanceRecords.map(record => `
                <tr>
                    <td>${record.date}</td>
                    <td>${record.time}</td>
                    <td>${record.id}</td>
                    <td>${record.name}</td>
                    <td>${record.journal ? escapeHtml(record.journal) : '<span style="color:#bbb;">-</span>'}</td>
                </tr>
            `).join('');
        }

        // 학생 리스트 로드 (학번 + 이름을 한 줄에)
        function loadStudentLists() {
            renderStudentListRows(studentData.slice().sort((a, b) => a.id.localeCompare(b.id)));
        }

        function renderStudentListRows(students) {
            const studentList = document.getElementById('studentList');
            studentList.innerHTML = students.map(s => `
                <div class="list-item" data-original-id="${s.id}">
                    <span class="field-label">학번</span>
                    <input type="text" value="${s.id}" placeholder="학번" data-type="id">
                    <span class="field-label">이름</span>
                    <input type="text" value="${s.name}" placeholder="이름" data-type="name">
                    <button class="btn-add" style="width:auto; margin:0; padding:8px 12px;" onclick="saveStudentRow(this)">저장</button>
                    <button class="btn-delete" onclick="deleteStudentRow(this)">삭제</button>
                </div>
            `).join('');
        }

        // 새 학생 행 추가 (빈 행, 아직 Supabase에 저장 전)
        function addStudent() {
            const studentList = document.getElementById('studentList');
            const newItem = document.createElement('div');
            newItem.className = 'list-item';
            newItem.setAttribute('data-original-id', '');
            newItem.innerHTML = `
                <span class="field-label">학번</span>
                <input type="text" placeholder="학번" data-type="id">
                <span class="field-label">이름</span>
                <input type="text" placeholder="이름" data-type="name">
                <button class="btn-add" style="width:auto; margin:0; padding:8px 12px;" onclick="saveStudentRow(this)">저장</button>
                <button class="btn-delete" onclick="deleteStudentRow(this)">삭제</button>
            `;
            studentList.appendChild(newItem);
        }

        // 학생 행 저장 (Supabase students 테이블에 반영)
        async function saveStudentRow(button) {
            const row = button.closest('.list-item');
            const idInput = row.querySelector('input[data-type="id"]');
            const nameInput = row.querySelector('input[data-type="name"]');
            const newId = idInput.value.trim();
            const newName = nameInput.value.trim();
            const originalId = row.getAttribute('data-original-id') || '';

            if (!newId || !newName) {
                alert('학번과 이름을 모두 입력해주세요.');
                return;
            }

            button.disabled = true;
            try {
                // 학번이 변경된 경우, 기존 행을 지우고 새로 만든다
                if (originalId && originalId !== newId) {
                    const { error: deleteError } = await supabaseClient
                        .from('students')
                        .delete()
                        .eq('student_id', originalId);
                    if (deleteError) throw deleteError;
                }

                const { error } = await supabaseClient
                    .from('students')
                    .upsert({ student_id: newId, name: newName }, { onConflict: 'student_id' });
                if (error) throw error;

                showStatus('✅ 학생 정보가 저장되었습니다!', 'success');
                await fetchStudentsFromSupabase();
            } catch (error) {
                showStatus(`❌ 저장 오류: ${error.message}`, 'error');
                console.error('학생 저장 오류:', error);
                button.disabled = false;
            }
        }

        // 학생 행 삭제 (저장 안 된 빈 행이면 화면에서만 제거, 저장된 행이면 Supabase에서도 삭제)
        async function deleteStudentRow(button) {
            const row = button.closest('.list-item');
            const originalId = row.getAttribute('data-original-id') || '';

            if (!originalId) {
                row.remove();
                return;
            }

            if (!confirm(`학번 ${originalId} 학생을 정말 삭제하시겠습니까? 해당 학생의 출석 기록은 남아있습니다.`)) {
                return;
            }

            button.disabled = true;
            try {
                const { error } = await supabaseClient
                    .from('students')
                    .delete()
                    .eq('student_id', originalId);
                if (error) throw error;

                showStatus('✅ 학생이 삭제되었습니다!', 'success');
                await fetchStudentsFromSupabase();
            } catch (error) {
                showStatus(`❌ 삭제 오류: ${error.message}`, 'error');
                console.error('학생 삭제 오류:', error);
                button.disabled = false;
            }
        }

        // 학생 버튼 로드 (등록된 전체 학생 기준, 출석 기록 유무와 무관)
        function loadStudentButtons() {
            const studentButtons = document.getElementById('studentButtons');
            const sortedStudents = studentData.slice().sort((a, b) => a.id.localeCompare(b.id));

            if (sortedStudents.length === 0) {
                studentButtons.innerHTML = '<p style="color: #999;">등록된 학생이 없습니다</p>';
                showChartPlaceholder();
                return;
            }

            studentButtons.innerHTML = sortedStudents.map(student => `
                <button class="student-btn" data-id="${student.id}" data-search="${student.id} ${student.name}"
                    onclick="selectStudent('${student.id}')" title="${student.id} ${student.name}">
                    ${student.id} ${student.name}
                </button>
            `).join('');

            // 기존에 선택 중이던 학생이 명단에 여전히 있으면 그 학생을 유지, 없으면 첫 번째 학생 선택
            const stillExists = currentStudent && sortedStudents.some(s => s.id === currentStudent.id);
            selectStudent(stillExists ? currentStudent.id : sortedStudents[0].id);
        }

        // 검색어로 학생 버튼 필터링
        function filterStudentButtons() {
            const keyword = document.getElementById('studentSearch').value.trim().toLowerCase();
            document.querySelectorAll('.student-btn').forEach(btn => {
                const haystack = (btn.getAttribute('data-search') || '').toLowerCase();
                btn.style.display = haystack.includes(keyword) ? '' : 'none';
            });
        }

        // 달력 월 이동
        function changeCalendarMonth(delta) {
            calendarDate.setMonth(calendarDate.getMonth() + delta);
            if (currentStudent) {
                renderCalendar();
            }
        }

        // 페이지 모드(그래프/일지) 전환
        function setPageMode(mode) {
            pageMode = mode;
            document.getElementById('pageGraphBtn').classList.toggle('active', mode === 'graph');
            document.getElementById('pageJournalBtn').classList.toggle('active', mode === 'journal');
            document.getElementById('graphPage').style.display = mode === 'graph' ? '' : 'none';
            document.getElementById('journalPage').style.display = mode === 'journal' ? '' : 'none';

            if (!currentStudent) return;
            if (mode === 'graph') {
                renderCalendar();
            } else {
                renderJournalPage(currentStudent.id);
            }
        }

        // 하루 일지 목록 렌더링 (해당 학생의 출석 기록을 최신순으로, 일지 내용과 함께)
        function renderJournalPage(studentId) {
            const attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords') || '[]');
            const studentRecords = attendanceRecords
                .filter(r => r.id === studentId)
                .sort((a, b) => b.date.localeCompare(a.date));

            const journalList = document.getElementById('journalList');

            if (studentRecords.length === 0) {
                journalList.innerHTML = '<p style="color: #999; text-align:center; padding: 30px 0;">출석 기록이 없습니다.</p>';
                return;
            }

            journalList.innerHTML = studentRecords.map(r => `
                <div class="journal-entry">
                    <div class="journal-entry-date">📅 ${r.date}</div>
                    <div class="journal-entry-text ${r.journal ? '' : 'empty'}">${r.journal ? escapeHtml(r.journal) : '(작성한 일지가 없습니다)'}</div>
                </div>
            `).join('');
        }

        // 간단한 HTML 이스케이프 (일지 내용에 <, > 등이 들어가도 안전하게)
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // 학생 선택
        function selectStudent(studentId) {
            const student = studentData.find(s => s.id === studentId);
            if (!student) return;
            currentStudent = student;
            calendarDate = new Date(); // 학생 바꾸면 달력은 이번 달로 리셋

            document.querySelectorAll('.student-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-id') === studentId);
            });

            if (pageMode === 'journal') {
                renderJournalPage(studentId);
            } else {
                renderCalendar();
            }
        }

        // 달력/통계 플레이스홀더 (등록된 학생이 없을 때)
        function showChartPlaceholder() {
            document.getElementById('calendarGrid').innerHTML = '<p style="grid-column: 1 / -1; color: #999; text-align:center; padding: 30px 0;">출석 기록이 없습니다. 학생들의 출석을 기록해주세요.</p>';
            document.getElementById('calendarTitle').textContent = '-';
            document.getElementById('statsCards').innerHTML = '';
            document.getElementById('journalList').innerHTML = '';
        }

        // 로컬(브라우저) 기준 날짜를 YYYY-MM-DD로 반환
        function getLocalDateString(d = new Date()) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 요약 통계 카드 렌더링
        function renderStatsCards(studentId) {
            const attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords') || '[]');
            const studentRecords = attendanceRecords.filter(r => r.id === studentId);
            const totalClassDays = new Set(attendanceRecords.map(r => r.date)).size;
            const attendedDays = new Set(studentRecords.map(r => r.date)).size;
            const absentDays = Math.max(totalClassDays - attendedDays, 0);
            const rate = totalClassDays > 0 ? Math.round((attendedDays / totalClassDays) * 100) : null;

            let lastDateLabel = '기록 없음';
            if (studentRecords.length > 0) {
                const lastDate = studentRecords.map(r => r.date).sort().pop();
                const daysAgo = Math.round((new Date().setHours(0,0,0,0) - new Date(lastDate).setHours(0,0,0,0)) / 86400000);
                lastDateLabel = daysAgo === 0 ? `${lastDate} (오늘)` : `${lastDate} (${daysAgo}일 전)`;
            }

            const cards = [
                { value: attendedDays, label: '총 출석 횟수', muted: false },
                { value: absentDays, label: '결석 횟수 (진행된 수업 기준)', muted: true },
                { value: rate === null ? '-' : `${rate}%`, label: '출석률', muted: false },
                { value: lastDateLabel, label: '최근 출석일', muted: true }
            ];

            document.getElementById('statsCards').innerHTML = cards.map(c => `
                <div class="stat-card ${c.muted ? 'muted' : ''}">
                    <div class="stat-card-value">${c.value}</div>
                    <div class="stat-card-label">${c.label}</div>
                </div>
            `).join('');
        }

        // 현재 선택된 학생의 출석 달력 렌더링
        function renderCalendar() {
            if (!currentStudent) return;
            const { id } = currentStudent;

            renderStatsCards(id);

            const attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords') || '[]');
            const attendedDates = new Set(
                attendanceRecords.filter(r => r.id === id).map(r => r.date)
            );

            const year = calendarDate.getFullYear();
            const month = calendarDate.getMonth(); // 0-indexed
            document.getElementById('calendarTitle').textContent = `${year}년 ${month + 1}월`;

            const firstDay = new Date(year, month, 1);
            const startWeekday = firstDay.getDay(); // 0 = 일요일
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const todayStr = getLocalDateString(new Date());

            let cellsHtml = '';
            for (let i = 0; i < startWeekday; i++) {
                cellsHtml += `<div class="calendar-day empty"></div>`;
            }
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const attended = attendedDates.has(dateStr);
                const isToday = dateStr === todayStr;
                cellsHtml += `
                    <div class="calendar-day ${attended ? 'attended' : ''} ${isToday ? 'today' : ''}">
                        <span class="calendar-day-number">${day}</span>
                        ${attended ? '<span class="calendar-check">✓</span>' : ''}
                    </div>
                `;
            }

            document.getElementById('calendarGrid').innerHTML = cellsHtml;
        }

        // 로컬 백업
        function backupData() {
            const attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords') || '[]');
            const backupData = {
                backupDate: new Date().toISOString(),
                records: attendanceRecords
            };

            const dataStr = JSON.stringify(backupData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            const now = new Date();
            const localDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            link.download = `attendance-backup-${localDate}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showStatus('✅ 로컬 백업 완료!', 'success');
        }

        // 로컬 복구
        function restoreData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const backupData = JSON.parse(e.target.result);
                    if (backupData.records && Array.isArray(backupData.records)) {
                        localStorage.setItem('attendanceRecords', JSON.stringify(backupData.records));
                        showStatus('✅ 로컬 복구 완료!', 'success');
                        location.reload();
                    } else {
                        showStatus('❌ 올바른 백업 파일이 아닙니다', 'error');
                    }
                } catch (error) {
                    showStatus('❌ 파일을 읽을 수 없습니다', 'error');
                }
            };
            reader.readAsText(file);

            event.target.value = '';
        }

        // 로그아웃
        function logout() {
            sessionStorage.removeItem('managerAuthenticated');
            sessionStorage.removeItem('managerAuthTime');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
