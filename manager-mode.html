<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 모드 - 출석 관리</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header-title {
            font-size: 36px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            margin-bottom: 10px;
        }

        .logout-btn {
            background: white;
            color: #f5576c;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            display: inline-block;
            margin-top: 10px;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        .section-title {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #f5576c;
        }

        /* 리스트 1 스타일 */
        .attendance-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .attendance-item {
            background: #f9f9f9;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #f5576c;
            font-size: 14px;
            line-height: 1.6;
        }

        .attendance-item .date {
            font-weight: bold;
            color: #f5576c;
        }

        .attendance-item .time {
            color: #666;
            font-size: 13px;
        }

        .attendance-item .student-info {
            color: #333;
            margin-top: 5px;
        }

        /* 리스트 2, 3 스타일 */
        .editable-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .list-item {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .list-item input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .list-item input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .btn-delete:hover {
            background: #d32f2f;
            transform: scale(1.05);
        }

        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-top: 10px;
            width: 100%;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        /* 버튼들의 모임 */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .student-btn {
            padding: 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #333;
            transition: all 0.3s ease;
        }

        .student-btn:hover {
            background: #f0f0f0;
            border-color: #f5576c;
        }

        .student-btn.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-color: #f5576c;
        }

        .chart-container {
            position: relative;
            height: 350px;
            margin-top: 20px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }
        }

        .scrollbar-style::-webkit-scrollbar {
            width: 8px;
        }

        .scrollbar-style::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .scrollbar-style::-webkit-scrollbar-thumb {
            background: #f5576c;
            border-radius: 10px;
        }

        .attendance-list {
            scrollbar-color: #f5576c #f1f1f1;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">📊 관리자 모드</div>
        <button class="logout-btn" onclick="logout()">로그아웃</button>
    </div>

    <div class="main-container">
        <!-- 리스트 1: 출석 기록 (읽기 전용) -->
        <div class="section">
            <div class="section-title">📋 리스트1 - 출석 기록</div>
            <div class="attendance-list scrollbar-style" id="attendanceList">
                <p style="color: #999; text-align: center;">출석 기록이 없습니다</p>
            </div>
        </div>

        <!-- 리스트 2: 이름 관리 -->
        <div class="section">
            <div class="section-title">👤 리스트2 - 이름 리스트</div>
            <div class="editable-list" id="nameList"></div>
            <button class="btn-add" onclick="addName()">+ 이름 추가</button>
        </div>

        <!-- 리스트 3: 학번 관리 -->
        <div class="section">
            <div class="section-title">🆔 리스트3 - 학번 리스트</div>
            <div class="editable-list" id="idList"></div>
            <button class="btn-add" onclick="addId()">+ 학번 추가</button>
        </div>

        <!-- 버튼들의 모임 및 그래프 -->
        <div class="section full-width">
            <div class="section-title">📈 학생별 출석 현황</div>
            <div class="buttons-grid" id="studentButtons"></div>
            <div class="chart-container">
                <canvas id="attendanceChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let chart = null;

        // 페이지 로드 시 초기화
        window.addEventListener('load', function() {
            initializeData();
            loadAttendanceRecords();
            loadStudentLists();
            loadStudentButtons();
        });

        // 초기 데이터 설정
        function initializeData() {
            let studentData = localStorage.getItem('studentData');
            if (!studentData) {
                const data = [
                    { id: '2024001', name: '김철수' },
                    { id: '2024002', name: '이영희' },
                    { id: '2024003', name: '박민준' }
                ];
                localStorage.setItem('studentData', JSON.stringify(data));
            }
        }

        // 출석 기록 로드
        function loadAttendanceRecords() {
            const attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords') || '[]');
            const attendanceList = document.getElementById('attendanceList');

            if (attendanceRecords.length === 0) {
                attendanceList.innerHTML = '<p style="color: #999; text-align: center;">출석 기록이 없습니다</p>';
                return;
            }

            attendanceList.innerHTML = attendanceRecords.map((record, index) => `
                <div class="attendance-item">
                    <div class="date">${record.date}</div>
                    <div class="time">${record.time}</div>
                    <div class="student-info">학번: ${record.id} | 이름: ${record.name}</div>
                </div>
            `).join('');
        }

        // 학생 리스트 로드
        function loadStudentLists() {
            const studentData = JSON.parse(localStorage.getItem('studentData') || '[]');
            
            // 이름 리스트
            const nameList = document.getElementById('nameList');
            const names = [...new Set(studentData.map(s => s.name))];
            nameList.innerHTML = names.map((name, index) => `
                <div class="list-item">
                    <input type="text" value="${name}" data-type="name" data-index="${index}">
                    <button class="btn-delete" onclick="deleteName(${index})">삭제</button>
                </div>
            `).join('');

            // 학번 리스트
            const idList = document.getElementById('idList');
            const ids = [...new Set(studentData.map(s => s.id))];
            idList.innerHTML = ids.map((id, index) => `
                <div class="list-item">
                    <input type="text" value="${id}" data-type="id" data-index="${index}">
                    <button class="btn-delete" onclick="deleteId(${index})">삭제</button>
                </div>
            `).join('');

            // 입력 필드에 변경 이벤트 추가
            document.querySelectorAll('input[data-type]').forEach(input => {
                input.addEventListener('change', saveStudentData);
            });
        }

        // 학생 버튼 로드
        function loadStudentButtons() {
            const studentData = JSON.parse(localStorage.getItem('studentData') || '[]');
            const names = [...new Set(studentData.map(s => s.name))];
            const studentButtons = document.getElementById('studentButtons');

            studentButtons.innerHTML = names.map((name, index) => `
                <button class="student-btn" onclick="showStudentChart('${name}')" ${index === 0 ? 'class="student-btn active"' : ''}>
                    ${name}
                </button>
            `).join('');

            // 첫 번째 학생의 차트 표시
            if (names.length > 0) {
                showStudentChart(names[0]);
            }
        }

        // 학생별 차트 표시
        function showStudentChart(studentName) {
            // 버튼 활성화 표시
            document.querySelectorAll('.student-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent === studentName) {
                    btn.classList.add('active');
                }
            });

            // 월별 출석 데이터 계산
            const attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords') || '[]');
            const monthlyData = {};

            attendanceRecords.forEach(record => {
                if (record.name === studentName) {
                    const [year, month] = record.date.split('-');
                    const monthKey = `${month}월`;
                    monthlyData[monthKey] = (monthlyData[monthKey] || 0) + 1;
                }
            });

            // 모든 월 생성
            const allMonths = [];
            for (let i = 1; i <= 12; i++) {
                allMonths.push(`${i}월`);
            }

            const data = allMonths.map(month => monthlyData[month] || 0);

            // 차트 업데이트
            const ctx = document.getElementById('attendanceChart').getContext('2d');
            
            if (chart) {
                chart.destroy();
            }

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: allMonths,
                    datasets: [{
                        label: `${studentName}의 월별 출석 현황`,
                        data: data,
                        borderColor: '#f5576c',
                        backgroundColor: 'rgba(245, 87, 108, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 6,
                        pointBackgroundColor: '#f5576c',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointHoverRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                font: { size: 14, weight: 'bold' }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            }
                        }
                    }
                }
            });
        }

        // 이름 추가
        function addName() {
            const nameList = document.getElementById('nameList');
            const newItem = document.createElement('div');
            newItem.className = 'list-item';
            newItem.innerHTML = `
                <input type="text" placeholder="새 이름을 입력하세요" data-type="name" data-index="new">
                <button class="btn-delete" onclick="this.parentElement.remove()">삭제</button>
            `;
            nameList.appendChild(newItem);
        }

        // 이름 삭제
        function deleteName(index) {
            const studentData = JSON.parse(localStorage.getItem('studentData') || '[]');
            const names = [...new Set(studentData.map(s => s.name))];
            const nameToDelete = names[index];

            // 해당 이름의 모든 항목 삭제
            const filtered = studentData.filter(s => s.name !== nameToDelete);
            localStorage.setItem('studentData', JSON.stringify(filtered));

            loadStudentLists();
            loadStudentButtons();
        }

        // 학번 추가
        function addId() {
            const idList = document.getElementById('idList');
            const newItem = document.createElement('div');
            newItem.className = 'list-item';
            newItem.innerHTML = `
                <input type="text" placeholder="새 학번을 입력하세요" data-type="id" data-index="new">
                <button class="btn-delete" onclick="this.parentElement.remove()">삭제</button>
            `;
            idList.appendChild(newItem);
        }

        // 학번 삭제
        function deleteId(index) {
            const studentData = JSON.parse(localStorage.getItem('studentData') || '[]');
            const ids = [...new Set(studentData.map(s => s.id))];
            const idToDelete = ids[index];

            // 해당 학번의 모든 항목 삭제
            const filtered = studentData.filter(s => s.id !== idToDelete);
            localStorage.setItem('studentData', JSON.stringify(filtered));

            loadStudentLists();
            loadStudentButtons();
        }

        // 학생 데이터 저장
        function saveStudentData() {
            const studentData = JSON.parse(localStorage.getItem('studentData') || '[]');
            const names = Array.from(document.querySelectorAll('#nameList input')).map(input => input.value);
            const ids = Array.from(document.querySelectorAll('#idList input')).map(input => input.value);

            // 새로운 데이터 생성
            const newData = [];
            names.forEach(name => {
                ids.forEach(id => {
                    if (name && id) {
                        newData.push({ id, name });
                    }
                });
            });

            localStorage.setItem('studentData', JSON.stringify(newData));
            loadAttendanceRecords(); // 학생 모드 데이터 업데이트
        }

        // 로그아웃
        function logout() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
