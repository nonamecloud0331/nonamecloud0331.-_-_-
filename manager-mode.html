<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="관리자 모드 - 출석 관리">
    <title>관리자 모드 - 출석 관리</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header-title {
            font-size: 36px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            margin-bottom: 10px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .logout-btn, .backup-btn, .restore-btn {
            background: white;
            color: #f5576c;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .logout-btn:hover, .backup-btn:hover, .restore-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        .section-title {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #f5576c;
        }

        /* 테이블 스타일 */
        .table-wrapper {
            overflow-x: auto;
            max-height: 500px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        table thead {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border: 1px solid #ddd;
        }

        table td {
            padding: 12px;
            border: 1px solid #eee;
        }

        table tbody tr {
            transition: background-color 0.3s ease;
        }

        table tbody tr:hover {
            background-color: #f9f9f9;
        }

        table tbody tr:nth-child(even) {
            background-color: #f5f5f5;
        }

        .no-data {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        /* 리스트 2, 3 스타일 */
        .editable-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .list-item {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .list-item input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .list-item input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .btn-delete:hover {
            background: #d32f2f;
            transform: scale(1.05);
        }

        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-top: 10px;
            width: 100%;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        /* 버튼들의 모임 */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .student-btn {
            padding: 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #333;
            transition: all 0.3s ease;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .student-btn:hover {
            background: #f0f0f0;
            border-color: #f5576c;
        }

        .student-btn.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-color: #f5576c;
        }

        .chart-container {
            position: relative;
            height: 350px;
            margin-top: 20px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .chart-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 350px;
            color: #999;
            font-size: 18px;
            background: #f9f9f9;
            border-radius: 10px;
            border: 2px dashed #ddd;
        }

        #restoreFileInput {
            display: none;
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }
        }

        /* 스크롤바 스타일 */
        .table-wrapper::-webkit-scrollbar,
        .editable-list::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .table-wrapper::-webkit-scrollbar-track,
        .editable-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .table-wrapper::-webkit-scrollbar-thumb,
        .editable-list::-webkit-scrollbar-thumb {
            background: #f5576c;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">📊 관리자 모드</div>
        <div class="header-buttons">
            <button class="backup-btn" onclick="backupData()">💾 데이터 백업</button>
            <button class="restore-btn" onclick="document.getElementById('restoreFileInput').click()">📂 데이터 복구</button>
            <button class="logout-btn" onclick="logout()">로그아웃</button>
        </div>
        <input type="file" id="restoreFileInput" accept=".json" onchange="restoreData(event)">
    </div>

    <div class="main-container">
        <!-- 출석 기록 (표 형식) -->
        <div class="section full-width">
            <div class="section-title">📋 출석 기록</div>
            <div class="table-wrapper">
                <table id="attendanceTable">
                    <thead>
                        <tr>
                            <th>날짜</th>
                            <th>시간</th>
                            <th>학번</th>
                            <th>이름</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTableBody">
                        <tr>
                            <td colspan="4" class="no-data">출석 기록이 없습니다</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 이름 관리 -->
        <div class="section">
            <div class="section-title">👤 이름 리스트</div>
            <div class="editable-list" id="nameList"></div>
            <button class="btn-add" onclick="addName()">+ 이름 추가</button>
        </div>

        <!-- 학번 관리 -->
        <div class="section">
            <div class="section-title">🆔 학번 리스트</div>
            <div class="editable-list" id="idList"></div>
            <button class="btn-add" onclick="addId()">+ 학번 추가</button>
        </div>

        <!-- 월별 출석 그래프 -->
        <div class="section full-width">
            <div class="section-title">📈 학생별 월별 출석 현황</div>
            <div class="buttons-grid" id="studentButtons"></div>
            <div class="chart-container">
                <canvas id="attendanceChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let chart = null;

        // 페이지 로드 시 초기화
        window.addEventListener('load', function() {
            loadAttendanceRecords();
            loadStudentLists();
            loadStudentButtons();
        });

        // 출석 기록 로드 (표 형식)
        function loadAttendanceRecords() {
            const attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords') || '[]');
            const tableBody = document.getElementById('attendanceTableBody');

            if (attendanceRecords.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="4" class="no-data">출석 기록이 없습니다</td></tr>';
                return;
            }

            tableBody.innerHTML = attendanceRecords.map(record => `
                <tr>
                    <td>${record.date}</td>
                    <td>${record.time}</td>
                    <td>${record.id}</td>
                    <td>${record.name}</td>
                </tr>
            `).join('');
        }

        // 학생 리스트 로드
        function loadStudentLists() {
            const studentData = [
                { id: '10503', name: '김건욱' },
                { id: '10702', name: '김주영' },
                { id: '10708', name: '서이준' },
                { id: '10716', name: '이재하' },
                { id: '10723', name: '차지호' },
                { id: '20210', name: '민하율' },
                { id: '20221', name: '이준서' },
                { id: '20225', name: '조승연' },
                { id: '20326', name: '최민준' },
                { id: '20405', name: '강서준' },
                { id: '20422', name: '이예준' },
                { id: '20619', name: '이윤건' },
                { id: '20717', name: '이건우' },
                { id: '20720', name: '이재욱' },
                { id: '20801', name: '강도윤' },
                { id: '30204', name: '김량렬' },
                { id: '30425', name: '정진원' },
                { id: '30514', name: '손나빈' },
                { id: '30706', name: '김영헌' },
                { id: '30720', name: '장시현' }
            ];
            
            // 이름 리스트
            const nameList = document.getElementById('nameList');
            const names = [...new Set(studentData.map(s => s.name))].sort();
            nameList.innerHTML = names.map((name, index) => `
                <div class="list-item">
                    <input type="text" value="${name}" data-type="name" data-index="${index}">
                    <button class="btn-delete" onclick="deleteName(${index})">삭제</button>
                </div>
            `).join('');

            // 학번 리스트
            const idList = document.getElementById('idList');
            const ids = [...new Set(studentData.map(s => s.id))].sort();
            idList.innerHTML = ids.map((id, index) => `
                <div class="list-item">
                    <input type="text" value="${id}" data-type="id" data-index="${index}">
                    <button class="btn-delete" onclick="deleteId(${index})">삭제</button>
                </div>
            `).join('');
        }

        // 학생 버튼 로드
        function loadStudentButtons() {
            const attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords') || '[]');
            
            // 출석 기록에 있는 학생들만 추출
            const studentsWithAttendance = [...new Set(attendanceRecords.map(r => r.name))].sort();
            
            const studentButtons = document.getElementById('studentButtons');
            
            if (studentsWithAttendance.length === 0) {
                studentButtons.innerHTML = '<p style="color: #999;">출석 기록이 없습니다</p>';
                showChartPlaceholder();
                return;
            }

            studentButtons.innerHTML = studentsWithAttendance.map((name, index) => `
                <button class="student-btn ${index === 0 ? 'active' : ''}" onclick="showStudentChart('${name}')" title="${name}">
                    ${name}
                </button>
            `).join('');

            // 첫 번째 학생의 차트 표시
            if (studentsWithAttendance.length > 0) {
                showStudentChart(studentsWithAttendance[0]);
            }
        }

        // 차트 플레이스홀더 표시
        function showChartPlaceholder() {
            const chartContainer = document.querySelector('.chart-container');
            chartContainer.innerHTML = '<div class="chart-placeholder">출석 기록이 없습니다. 학생들의 출석을 기록해주세요.</div>';
            if (chart) {
                chart.destroy();
                chart = null;
            }
        }

        // 학생별 차트 표시
        function showStudentChart(studentName) {
            // 버튼 활성화 표시
            document.querySelectorAll('.student-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.trim() === studentName) {
                    btn.classList.add('active');
                }
            });

            // 월별 출석 데이터 계산
            const attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords') || '[]');
            const monthlyData = {};

            attendanceRecords.forEach(record => {
                if (record.name === studentName) {
                    const [year, month] = record.date.split('-');
                    const monthKey = `${month}월`;
                    monthlyData[monthKey] = (monthlyData[monthKey] || 0) + 1;
                }
            });

            // 모든 월 생성
            const allMonths = [];
            for (let i = 1; i <= 12; i++) {
                allMonths.push(`${i}월`);
            }

            const data = allMonths.map(month => monthlyData[month] || 0);

            // 차트 업데이트
            const chartContainer = document.querySelector('.chart-container');
            chartContainer.innerHTML = '<canvas id="attendanceChart"></canvas>';
            const ctx = document.getElementById('attendanceChart').getContext('2d');
            
            if (chart) {
                chart.destroy();
            }

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: allMonths,
                    datasets: [{
                        label: `${studentName}의 월별 출석 현황`,
                        data: data,
                        borderColor: '#f5576c',
                        backgroundColor: 'rgba(245, 87, 108, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 6,
                        pointBackgroundColor: '#f5576c',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointHoverRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                font: { size: 14, weight: 'bold' }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            }
                        }
                    }
                }
            });
        }

        // 이름 추가
        function addName() {
            const nameList = document.getElementById('nameList');
            const newItem = document.createElement('div');
            newItem.className = 'list-item';
            newItem.innerHTML = `
                <input type="text" placeholder="새 이름을 입력하세요" data-type="name">
                <button class="btn-delete" onclick="this.parentElement.remove()">삭제</button>
            `;
            nameList.appendChild(newItem);
        }

        // 이름 삭제
        function deleteName(index) {
            const names = Array.from(document.querySelectorAll('#nameList input')).map(input => input.value);
            names.splice(index, 1);
            
            const nameList = document.getElementById('nameList');
            nameList.innerHTML = names.map((name, idx) => `
                <div class="list-item">
                    <input type="text" value="${name}" data-type="name">
                    <button class="btn-delete" onclick="deleteName(${idx})">삭제</button>
                </div>
            `).join('');
        }

        // 학번 추가
        function addId() {
            const idList = document.getElementById('idList');
            const newItem = document.createElement('div');
            newItem.className = 'list-item';
            newItem.innerHTML = `
                <input type="text" placeholder="새 학번을 입력하세요" data-type="id">
                <button class="btn-delete" onclick="this.parentElement.remove()">삭제</button>
            `;
            idList.appendChild(newItem);
        }

        // 학번 삭제
        function deleteId(index) {
            const ids = Array.from(document.querySelectorAll('#idList input')).map(input => input.value);
            ids.splice(index, 1);
            
            const idList = document.getElementById('idList');
            idList.innerHTML = ids.map((id, idx) => `
                <div class="list-item">
                    <input type="text" value="${id}" data-type="id">
                    <button class="btn-delete" onclick="deleteId(${idx})">삭제</button>
                </div>
            `).join('');
        }

        // 데이터 백업 (JSON 파일로 다운로드)
        function backupData() {
            const attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords') || '[]');
            const backupData = {
                backupDate: new Date().toISOString(),
                records: attendanceRecords
            };
            
            const dataStr = JSON.stringify(backupData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `attendance-backup-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            alert('데이터가 백업되었습니다!');
        }

        // 데이터 복구 (백업 파일에서 복구)
        function restoreData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const backupData = JSON.parse(e.target.result);
                    if (backupData.records && Array.isArray(backupData.records)) {
                        localStorage.setItem('attendanceRecords', JSON.stringify(backupData.records));
                        alert('데이터가 복구되었습니다!');
                        location.reload();
                    } else {
                        alert('올바른 백업 파일이 아닙니다.');
                    }
                } catch (error) {
                    alert('파일을 읽을 수 없습니다.');
                }
            };
            reader.readAsText(file);

            // 파일 입력 초기화
            event.target.value = '';
        }

        // 로그아웃
        function logout() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
