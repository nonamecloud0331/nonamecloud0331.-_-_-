<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="관리자 비밀번호 인증">
    <title>관리자 비밀번호 입력</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .header {
            margin-bottom: 40px;
        }

        .title {
            font-size: 28px;
            color: white;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .illustration {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            text-align: left;
        }

        .form-group input {
            width: 100%;
            padding: 14px 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #f5576c;
            box-shadow: 0 0 0 3px rgba(245, 87, 108, 0.1);
        }

        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            display: none;
            padding: 10px;
            background-color: #ffebee;
            border-radius: 8px;
            border-left: 4px solid #d32f2f;
        }

        .error-message.show {
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.3);
            margin-top: 20px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(245, 87, 108, 0.4);
        }

        .submit-btn:focus {
            outline: 3px solid rgba(245, 87, 108, 0.5);
            outline-offset: 2px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .back-link:hover,
        .back-link:focus {
            color: #764ba2;
            text-decoration: underline;
        }

        .attempts-info {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 35px 25px;
            }

            .title {
                font-size: 24px;
                padding: 15px;
            }

            .illustration {
                width: 120px;
                height: 120px;
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">🔐 관리자 모드</div>
            <div class="illustration">🔑</div>
        </div>

        <form id="passwordForm">
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="비밀번호를 입력해주세요"
                    required
                    aria-label="관리자 비밀번호"
                >
            </div>

            <div class="error-message" id="errorMessage" role="alert"></div>
            <div class="attempts-info" id="attemptsInfo"></div>

            <button type="submit" class="submit-btn">확인</button>
        </form>

        <a href="index.html" class="back-link">← 뒤로가기</a>
    </div>

    <script>
        // ⚠️ 보안: 프로덕션 환경에서는 서버에서 검증해야 합니다
        // 클라이언트에 비밀번호를 저장하는 것은 보안 위험입니다
        const MANAGER_PASSWORD = '9872451';
        const MAX_ATTEMPTS = 5;
        const LOCKOUT_TIME = 15 * 60 * 1000; // 15분

        function getAttemptData() {
            const data = localStorage.getItem('passwordAttempts');
            if (!data) {
                return { attempts: 0, lastAttempt: null, lockedUntil: null };
            }
            return JSON.parse(data);
        }

        function saveAttemptData(data) {
            localStorage.setItem('passwordAttempts', JSON.stringify(data));
        }

        function isLockedOut(attemptData) {
            if (!attemptData.lockedUntil) return false;
            const now = Date.now();
            if (now < attemptData.lockedUntil) {
                return true;
            }
            // 락 시간 만료
            attemptData.attempts = 0;
            attemptData.lockedUntil = null;
            saveAttemptData(attemptData);
            return false;
        }

        function getRemainingLockoutTime(lockedUntil) {
            const remaining = Math.ceil((lockedUntil - Date.now()) / 1000);
            const minutes = Math.floor(remaining / 60);
            const seconds = remaining % 60;
            return `${minutes}분 ${seconds}초`;
        }

        document.getElementById('passwordForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const inputPassword = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const attemptsInfo = document.getElementById('attemptsInfo');
            const submitBtn = document.querySelector('.submit-btn');
            const passwordInput = document.getElementById('password');

            const attemptData = getAttemptData();

            // 계정 잠금 확인
            if (isLockedOut(attemptData)) {
                const remainingTime = getRemainingLockoutTime(attemptData.lockedUntil);
                errorMessage.textContent = `너무 많은 시도로 인해 잠금되었습니다. ${remainingTime} 후 다시 시도해주세요.`;
                errorMessage.classList.add('show');
                submitBtn.disabled = true;
                passwordInput.disabled = true;
                return;
            }

            // 비밀번호 확인
            if (inputPassword === MANAGER_PASSWORD) {
                // 비밀번호 맞음
                errorMessage.classList.remove('show');
                attemptsInfo.textContent = '';
                localStorage.removeItem('passwordAttempts');
                // 관리자 인증 완료 표시 (세션 동안만 유지, 새 탭/브라우저 종료 시 만료)
                sessionStorage.setItem('managerAuthenticated', 'true');
                sessionStorage.setItem('managerAuthTime', Date.now().toString());
                window.location.href = 'manager-mode.html';
            } else {
                // 비밀번호 틀림
                attemptData.attempts++;
                attemptData.lastAttempt = Date.now();

                if (attemptData.attempts >= MAX_ATTEMPTS) {
                    attemptData.lockedUntil = Date.now() + LOCKOUT_TIME;
                    saveAttemptData(attemptData);
                    errorMessage.textContent = `너무 많은 시도로 인해 잠금되었습니다. 15분 후 다시 시도해주세요.`;
                    submitBtn.disabled = true;
                    passwordInput.disabled = true;
                } else {
                    saveAttemptData(attemptData);
                    const remainingAttempts = MAX_ATTEMPTS - attemptData.attempts;
                    errorMessage.textContent = '비밀번호가 일치하지 않습니다. 다시 입력해 주세요';
                    attemptsInfo.textContent = `남은 시도 횟수: ${remainingAttempts}/${MAX_ATTEMPTS}`;
                }

                errorMessage.classList.add('show');
                passwordInput.value = '';
                passwordInput.focus();
            }
        });

        // 페이지 로드 시 잠금 상태 확인
        window.addEventListener('load', function() {
            const attemptData = getAttemptData();
            if (isLockedOut(attemptData)) {
                const remainingTime = getRemainingLockoutTime(attemptData.lockedUntil);
                const errorMessage = document.getElementById('errorMessage');
                errorMessage.textContent = `계정이 잠금되었습니다. ${remainingTime} 후 다시 시도해주세요.`;
                errorMessage.classList.add('show');
                document.querySelector('.submit-btn').disabled = true;
                document.getElementById('password').disabled = true;
            }
        });
    </script>
</body>
</html>
