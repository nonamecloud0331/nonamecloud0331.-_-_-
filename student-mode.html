<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>출석 체크 - 학생용</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .title {
            font-size: 36px;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .illustration {
            width: 150px;
            height: 150px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .form-group select {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: border-color 0.3s ease;
            background-color: white;
        }

        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group select:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
        }

        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 15px;
            text-align: center;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
            background-color: #ccc;
            color: white;
        }

        .submit-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .submit-btn.active:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            .title {
                font-size: 28px;
                padding: 15px;
            }

            .illustration {
                width: 120px;
                height: 120px;
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">출석 체크</div>
            <div class="illustration">🎓</div>
        </div>

        <form id="attendanceForm">
            <div class="form-group">
                <label for="studentId">학번</label>
                <select id="studentId" required>
                    <option value="">-- 학번 선택 --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="studentName">이름</label>
                <select id="studentName" required>
                    <option value="">-- 이름 선택 --</option>
                </select>
            </div>

            <div class="error-message" id="errorMessage">질문에 모두 답해주세요</div>

            <button type="submit" class="submit-btn" id="submitBtn" disabled>출석 확인</button>
        </form>
    </div>

    <script>
        // 로컬스토리지에서 학생 정보 로드
        function loadStudentData() {
            const idSelect = document.getElementById('studentId');
            const nameSelect = document.getElementById('studentName');
            
            let studentData = localStorage.getItem('studentData');
            if (!studentData) {
                // 초기 데이터 설정
                studentData = JSON.stringify([
                    { id: '10503', name: '김건욱' },
                    { id: '10702', name: '김주영' },
                    { id: '10708', name: '서이준' },
                    { id: '10716', name: '이재하' },
                    { id: '10723', name: '차지호' },
                    { id: '20210', name: '민하율' },
                    { id: '20221', name: '이준서' },
                    { id: '20225', name: '조승연' },
                    { id: '20326', name: '최민준' },
                    { id: '20405', name: '강서준' },
                    { id: '20422', name: '이예준' },
                    { id: '20619', name: '이윤건' },
                    { id: '20717', name: '이건우' },
                    { id: '20720', name: '이재욱' },
                    { id: '20801', name: '강도윤' },
                    { id: '30204', name: '김량렬' },
                    { id: '30425', name: '정진원' },
                    { id: '30514', name: '손나빈' },
                    { id: '30706', name: '김영헌' },
                    { id: '30720', name: '장시현' }
                ]);
                localStorage.setItem('studentData', studentData);
            }

            const students = JSON.parse(studentData);
            const ids = [...new Set(students.map(s => s.id))];
            const names = [...new Set(students.map(s => s.name))];

            ids.forEach(id => {
                const option = document.createElement('option');
                option.value = id;
                option.textContent = id;
                idSelect.appendChild(option);
            });

            names.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                nameSelect.appendChild(option);
            });
        }

        // 선택 항목 검증
        function validateForm() {
            const idValue = document.getElementById('studentId').value;
            const nameValue = document.getElementById('studentName').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorMessage = document.getElementById('errorMessage');

            if (idValue && nameValue) {
                submitBtn.classList.add('active');
                submitBtn.disabled = false;
                errorMessage.classList.remove('show');
            } else {
                submitBtn.classList.remove('active');
                submitBtn.disabled = true;
            }
        }

        // 폼 제출
        document.getElementById('attendanceForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const idValue = document.getElementById('studentId').value;
            const nameValue = document.getElementById('studentName').value;
            const errorMessage = document.getElementById('errorMessage');

            if (!idValue || !nameValue) {
                errorMessage.classList.add('show');
                return;
            }

            // 중복 확인
            let attendanceRecords = localStorage.getItem('attendanceRecords');
            const records = attendanceRecords ? JSON.parse(attendanceRecords) : [];
            
            const today = new Date().toISOString().split('T')[0];
            const isDuplicate = records.some(record => 
                record.id === idValue && 
                record.name === nameValue && 
                record.date === today
            );

            if (isDuplicate) {
                // 완료 페이지로 이동 (중복)
                sessionStorage.setItem('isDuplicate', 'true');
                window.location.href = 'student-finish.html';
                return;
            }

            // 새 기록 추가
            const now = new Date();
            const record = {
                date: today,
                time: now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                id: idValue,
                name: nameValue,
                timestamp: now.getTime()
            };

            records.unshift(record); // 맨 앞에 추가
            localStorage.setItem('attendanceRecords', JSON.stringify(records));

            // 완료 페이지로 이동
            sessionStorage.setItem('isDuplicate', 'false');
            window.location.href = 'student-finish.html';
        });

        // 선택 변화 감지
        document.getElementById('studentId').addEventListener('change', validateForm);
        document.getElementById('studentName').addEventListener('change', validateForm);

        // 페이지 로드 시 데이터 불러오기
        window.addEventListener('load', loadStudentData);
    </script>
</body>
</html>
