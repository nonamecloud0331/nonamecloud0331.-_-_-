<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="출석 체크 - 학생용 시스템">
    <title>출석 체크 - 학생용</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .title {
            font-size: 36px;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .illustration {
            width: 150px;
            height: 150px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .form-group select {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: border-color 0.3s ease;
            background-color: white;
        }

        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group select:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
        }

        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 15px;
            text-align: center;
            display: none;
            padding: 10px;
            background-color: #ffebee;
            border-radius: 8px;
            border-left: 4px solid #d32f2f;
        }

        .error-message.show {
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
            background-color: #ccc;
            color: white;
        }

        .submit-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .submit-btn.active:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:focus {
            outline: 3px solid rgba(102, 126, 234, 0.5);
            outline-offset: 2px;
        }

        .submit-btn:disabled {
            cursor: not-allowed;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .back-link:hover,
        .back-link:focus {
            color: #764ba2;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            .title {
                font-size: 28px;
                padding: 15px;
            }

            .illustration {
                width: 120px;
                height: 120px;
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">출석 체크</div>
            <div class="illustration">🎓</div>
        </div>

        <form id="attendanceForm">
            <div class="form-group">
                <label for="studentSelect">학번 및 이름</label>
                <select id="studentSelect" required aria-label="학번 및 이름 선택">
                    <option value="">-- 학생 선택 --</option>
                </select>
            </div>

            <div class="error-message" id="errorMessage" role="alert"></div>

            <button type="submit" class="submit-btn" id="submitBtn" disabled>출석 확인</button>
        </form>

        <a href="index.html" class="back-link">← 뒤로가기</a>
    </div>

    <script>
        // Supabase 연결 설정
        const SUPABASE_URL = 'https://patxdjdibfqyucclhrde.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhdHhkamRpYmZxeXVjY2xocmRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0OTM1NTgsImV4cCI6MjA5OTA2OTU1OH0.-NHStGhdXLv1KCLQLNKTExFTVZeSU5x7AlfkysPuEs0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 학생 명단 (Supabase students 테이블에서 불러옴)
        let studentData = [];

        // 로컬(브라우저) 기준 날짜를 YYYY-MM-DD로 반환 (toISOString은 UTC라 새벽 시간대에 날짜가 밀리는 문제가 있어 직접 계산)
        function getLocalDateString(d = new Date()) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 페이지 로드 시 초기화
        window.addEventListener('load', function() {
            loadStudentOptions();
        });

        // 학생 옵션 로드
        async function loadStudentOptions() {
            const studentSelect = document.getElementById('studentSelect');
            const errorMessage = document.getElementById('errorMessage');

            try {
                const { data, error } = await supabaseClient
                    .from('students')
                    .select('*')
                    .order('student_id', { ascending: true });

                if (error) throw error;

                studentData = (data || []).map(row => ({ id: row.student_id, name: row.name }));

                studentData.forEach(student => {
                    const option = document.createElement('option');
                    option.value = JSON.stringify({ id: student.id, name: student.name });
                    option.textContent = `${student.id} ${student.name}`;
                    studentSelect.appendChild(option);
                });
            } catch (error) {
                errorMessage.textContent = '⚠️ 학생 명단을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해주세요.';
                errorMessage.classList.add('show');
                console.error('학생 명단 조회 오류:', error);
            }
        }

        // 선택 항목 검증
        function validateForm() {
            const studentSelect = document.getElementById('studentSelect');
            const submitBtn = document.getElementById('submitBtn');
            const errorMessage = document.getElementById('errorMessage');

            errorMessage.classList.remove('show');
            errorMessage.textContent = '';

            if (studentSelect.value) {
                submitBtn.classList.add('active');
                submitBtn.disabled = false;
            } else {
                submitBtn.classList.remove('active');
                submitBtn.disabled = true;
            }
        }

        // 폼 제출
        document.getElementById('attendanceForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const studentSelect = document.getElementById('studentSelect');
            const errorMessage = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');

            if (!studentSelect.value) {
                errorMessage.textContent = '학생을 선택해주세요.';
                errorMessage.classList.add('show');
                return;
            }

            const student = JSON.parse(studentSelect.value);
            const idValue = student.id;
            const nameValue = student.name;

            submitBtn.disabled = true;
            submitBtn.textContent = '확인 중...';

            // 오늘 날짜 확인 (주의: toISOString()은 UTC 기준이라 새벽 시간대에 날짜가 하루 밀릴 수 있어 로컬 날짜로 직접 계산)
            const now = new Date();
            const today = getLocalDateString(now);
            const timeValue = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            try {
                // Supabase에 출석 기록 추가 시도 (student_id + date가 유니크 제약이라 중복이면 에러 발생)
                const { error } = await supabaseClient
                    .from('attendance')
                    .insert({
                        student_id: idValue,
                        name: nameValue,
                        date: today,
                        time: timeValue
                    });

                if (error) {
                    if (error.code === '23505') {
                        // 유니크 제약 위반 = 오늘 이미 출석함
                        sessionStorage.setItem('isDuplicate', 'true');
                        sessionStorage.setItem('studentId', idValue);
                        sessionStorage.setItem('studentName', nameValue);
                        window.location.href = 'student-finish.html';
                        return;
                    }
                    throw error;
                }

                // 성공
                sessionStorage.setItem('isDuplicate', 'false');
                sessionStorage.setItem('studentId', idValue);
                sessionStorage.setItem('studentName', nameValue);
                window.location.href = 'student-finish.html';
            } catch (err) {
                errorMessage.textContent = '⚠️ 서버 연결에 실패했습니다. 인터넷 연결을 확인하고 다시 시도해주세요.';
                errorMessage.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = '출석 확인';
                console.error('출석 기록 오류:', err);
            }
        });

        // 선택 변화 감지
        document.getElementById('studentSelect').addEventListener('change', validateForm);
    </script>
</body>
</html>
