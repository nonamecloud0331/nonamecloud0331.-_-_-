<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="출석 체크 - 학생용 시스템">
    <title>출석 체크 - 학생용</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .title {
            font-size: 36px;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .illustration {
            width: 150px;
            height: 150px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .form-group select {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: border-color 0.3s ease;
            background-color: white;
        }

        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group select:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
        }

        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 15px;
            text-align: center;
            display: none;
            padding: 10px;
            background-color: #ffebee;
            border-radius: 8px;
            border-left: 4px solid #d32f2f;
        }

        .error-message.show {
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
            background-color: #ccc;
            color: white;
        }

        .submit-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .submit-btn.active:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:focus {
            outline: 3px solid rgba(102, 126, 234, 0.5);
            outline-offset: 2px;
        }

        .submit-btn:disabled {
            cursor: not-allowed;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .back-link:hover,
        .back-link:focus {
            color: #764ba2;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            .title {
                font-size: 28px;
                padding: 15px;
            }

            .illustration {
                width: 120px;
                height: 120px;
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">출석 체크</div>
            <div class="illustration">🎓</div>
        </div>

        <form id="attendanceForm">
            <div class="form-group">
                <label for="studentSelect">학번 및 이름</label>
                <select id="studentSelect" required aria-label="학번 및 이름 선택">
                    <option value="">-- 학생 선택 --</option>
                </select>
            </div>

            <div class="error-message" id="errorMessage" role="alert"></div>

            <button type="submit" class="submit-btn" id="submitBtn" disabled>출석 확인</button>
        </form>

        <a href="index.html" class="back-link">← 뒤로가기</a>
    </div>

    <script>
        // 학생 정보 (학번과 이름을 통합)
        const studentData = [
            { id: '10503', name: '김건욱' },
            { id: '10702', name: '김주영' },
            { id: '10708', name: '서이준' },
            { id: '10716', name: '이재하' },
            { id: '10723', name: '차지호' },
            { id: '20210', name: '민하율' },
            { id: '20221', name: '이준서' },
            { id: '20225', name: '조승연' },
            { id: '20326', name: '최민준' },
            { id: '20405', name: '강서준' },
            { id: '20422', name: '이예준' },
            { id: '20619', name: '이윤건' },
            { id: '20717', name: '이건우' },
            { id: '20720', name: '이재욱' },
            { id: '20801', name: '강도윤' },
            { id: '30204', name: '김량렬' },
            { id: '30425', name: '정진원' },
            { id: '30514', name: '손나빈' },
            { id: '30706', name: '김영헌' },
            { id: '30720', name: '장시현' }
        ];

        // 페이지 로드 시 초기화
        window.addEventListener('load', function() {
            loadStudentOptions();
        });

        // 학생 옵션 로드
        function loadStudentOptions() {
            const studentSelect = document.getElementById('studentSelect');
            
            // 학생 데이터를 "학번 이름" 형식으로 정렬
            const sortedStudents = studentData.slice().sort((a, b) => {
                return a.id.localeCompare(b.id);
            });

            sortedStudents.forEach(student => {
                const option = document.createElement('option');
                option.value = JSON.stringify({ id: student.id, name: student.name });
                option.textContent = `${student.id} ${student.name}`;
                studentSelect.appendChild(option);
            });
        }

        // 선택 항목 검증
        function validateForm() {
            const studentSelect = document.getElementById('studentSelect');
            const submitBtn = document.getElementById('submitBtn');
            const errorMessage = document.getElementById('errorMessage');

            errorMessage.classList.remove('show');
            errorMessage.textContent = '';

            if (studentSelect.value) {
                submitBtn.classList.add('active');
                submitBtn.disabled = false;
            } else {
                submitBtn.classList.remove('active');
                submitBtn.disabled = true;
            }
        }

        // 폼 제출
        document.getElementById('attendanceForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const studentSelect = document.getElementById('studentSelect');
            const errorMessage = document.getElementById('errorMessage');

            if (!studentSelect.value) {
                errorMessage.textContent = '학생을 선택해주세요.';
                errorMessage.classList.add('show');
                return;
            }

            const student = JSON.parse(studentSelect.value);
            const idValue = student.id;
            const nameValue = student.name;

            // 오늘 날짜 확인
            const today = new Date().toISOString().split('T')[0];
            
            // 출석 기록 확인
            let attendanceRecords = localStorage.getItem('attendanceRecords');
            const records = attendanceRecords ? JSON.parse(attendanceRecords) : [];
            
            // 오늘 같은 학번으로 이미 출석했는지 확인
            const isDuplicate = records.some(record => 
                record.id === idValue && 
                record.date === today
            );

            if (isDuplicate) {
                // 중복 출석 - 기록 추가 안 함
                sessionStorage.setItem('isDuplicate', 'true');
                sessionStorage.setItem('studentId', idValue);
                sessionStorage.setItem('studentName', nameValue);
                window.location.href = 'student-finish.html';
                return;
            }

            // 새 출석 기록 추가
            const now = new Date();
            const record = {
                date: today,
                time: now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                id: idValue,
                name: nameValue,
                timestamp: now.getTime()
            };

            records.unshift(record); // 맨 앞에 추가
            localStorage.setItem('attendanceRecords', JSON.stringify(records));

            // 완료 페이지로 이동
            sessionStorage.setItem('isDuplicate', 'false');
            sessionStorage.setItem('studentId', idValue);
            sessionStorage.setItem('studentName', nameValue);
            window.location.href = 'student-finish.html';
        });

        // 선택 변화 감지
        document.getElementById('studentSelect').addEventListener('change', validateForm);
    </script>
</body>
</html>
