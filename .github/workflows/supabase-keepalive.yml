name: Supabase Keepalive

# Supabase 무료 요금제는 7일 동안 DB 요청이 없으면 프로젝트가 자동으로 멈춰요(Pause).
# 이 워크플로우는 5일마다 heartbeat 테이블에 가벼운 값을 하나 썼다가 바로 지워서,
# 실제 출석/학생 데이터는 전혀 건드리지 않고 "활동 중"으로만 표시되게 해줘요.

on:
  schedule:
    - cron: '0 3 */5 * *'  # 5일마다 자동 실행 (UTC 03:00 = 한국시간 낮 12시)
  workflow_dispatch: {}     # Actions 탭에서 수동으로도 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Insert then delete a heartbeat row
        env:
          SUPABASE_URL: https://patxdjdibfqyucclhrde.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhdHhkamRpYmZxeXVjY2xocmRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0OTM1NTgsImV4cCI6MjA5OTA2OTU1OH0.-NHStGhdXLv1KCLQLNKTExFTVZeSU5x7AlfkysPuEs0
        run: |
          echo "1) heartbeat 테이블에 가벼운 값 추가"
          curl -sS -X POST "$SUPABASE_URL/rest/v1/heartbeat" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}'

          echo "2) heartbeat 테이블 전체 비우기 (흔적 안 남기기)"
          curl -sS -X DELETE "$SUPABASE_URL/rest/v1/heartbeat?id=gt.0" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Prefer: return=minimal"

          echo "완료: Supabase 프로젝트 활동 기록을 남겼습니다."
